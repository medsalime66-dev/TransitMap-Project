<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .stat-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .stat-card .number { font-size: 36px; font-weight: 700; }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
        .card-box {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .card-box .box-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #1a1a2e;
        }
        .badge-attente { background:#FAEEDA;color:#633806;padding:3px 10px;border-radius:20px;font-size:12px; }
        .badge-approuve { background:#EAF3DE;color:#3B6D11;padding:3px 10px;border-radius:20px;font-size:12px; }
        .badge-rejete { background:#FCEBEB;color:#A32D2D;padding:3px 10px;border-radius:20px;font-size:12px; }
        .badge-active { background:#EAF3DE;color:#3B6D11;padding:3px 10px;border-radius:20px;font-size:12px; }
        .badge-progress { background:#E6F1FB;color:#185FA5;padding:3px 10px;border-radius:20px;font-size:12px; }
        .badge-inactive { background:#F1EFE8;color:#5F5E5A;padding:3px 10px;border-radius:20px;font-size:12px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <h5 style="font-weight:600;margin-bottom:20px;">Tableau de bord Admin</h5>

    <!-- Stats -->
    <div class="row g-3">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="number" style="color:#185FA5;"
                     th:text="${totalLignes}">0</div>
                <div class="label">Lignes</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="number" style="color:#3B6D11;"
                     th:text="${totalArrets}">0</div>
                <div class="label">Arrêts</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="number" style="color:#BA7517;"
                     th:text="${totalVehicules}">0</div>
                <div class="label">Véhicules</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="number" style="color:#7F77DD;"
                     th:text="${totalUsers}">0</div>
                <div class="label">Utilisateurs</div>
            </div>
        </div>
    </div>

    <!-- Trajets du jour -->
    <div class="card-box">
        <div class="box-title">Trajets d'aujourd'hui</div>
        <div th:if="${#lists.isEmpty(trajetsAujourdhui)}"
             style="color:#888;font-size:13px;text-align:center;padding:20px 0;">
            Aucun trajet aujourd'hui.
        </div>
        <table class="table table-borderless"
               th:if="${!#lists.isEmpty(trajetsAujourdhui)}">
            <thead style="font-size:12px;color:#888;">
                <tr><th>Ligne</th><th>Départ</th><th>Arrivée</th><th>Statut</th></tr>
            </thead>
            <tbody style="font-size:13px;">
                <tr th:each="t : ${trajetsAujourdhui}">
                    <td th:text="${t.ligne.nom}"></td>
                    <td th:text="${t.heureDepart}"></td>
                    <td th:text="${t.heureArrivee}"></td>
                    <td>
                        <span th:class="${t.statut=='ACTIVE'}?'badge-active':
                                        (${t.statut=='EN_COURS'}?'badge-progress':'badge-inactive')"
                              th:text="${t.statut}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Demandes en attente -->
    <div class="card-box">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
            <div class="box-title" style="margin:0;">Demandes en attente</div>
            <a th:href="@{/admin/demandes}"
               style="font-size:13px;color:#185FA5;text-decoration:none;">
                Voir tout →
            </a>
        </div>
        <div th:if="${#lists.isEmpty(demandesEnAttente)}"
             style="color:#888;font-size:13px;text-align:center;padding:20px 0;">
            Aucune demande en attente.
        </div>
        <table class="table table-borderless"
               th:if="${!#lists.isEmpty(demandesEnAttente)}">
            <thead style="font-size:12px;color:#888;">
                <tr><th>Agent</th><th>Ligne</th><th>Numéro</th><th>Date</th><th>Action</th></tr>
            </thead>
            <tbody style="font-size:13px;">
                <tr th:each="d : ${demandesEnAttente}">
                    <td th:text="${d.agentUsername}"></td>
                    <td th:text="${d.nomLigne}"></td>
                    <td th:text="${d.numeroLigne}"></td>
                    <td th:text="${#temporals.format(d.dateCreation,'dd/MM/yyyy')}"></td>
                    <td>
                        <a th:href="@{/admin/demandes}"
                           style="font-size:12px;color:#185FA5;">Traiter</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Raccourcis CRUD -->
    <div class="card-box">
        <div class="box-title">Gestion</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <a th:href="@{/lignes}"
               style="background:#E6F1FB;color:#185FA5;padding:8px 18px;border-radius:8px;font-size:13px;text-decoration:none;">
                Lignes
            </a>
            <a th:href="@{/arrets}"
               style="background:#EAF3DE;color:#3B6D11;padding:8px 18px;border-radius:8px;font-size:13px;text-decoration:none;">
                Arrêts
            </a>
            <a th:href="@{/vehicules}"
               style="background:#FAEEDA;color:#633806;padding:8px 18px;border-radius:8px;font-size:13px;text-decoration:none;">
                Véhicules
            </a>
            <a th:href="@{/trajets}"
               style="background:#EEEDFE;color:#3C3489;padding:8px 18px;border-radius:8px;font-size:13px;text-decoration:none;">
                Trajets
            </a>
            <a th:href="@{/admin/users}"
               style="background:#F1EFE8;color:#5F5E5A;padding:8px 18px;border-radius:8px;font-size:13px;text-decoration:none;">
                Utilisateurs
            </a>
        </div>
    </div>

</div>
</body>
</html>
