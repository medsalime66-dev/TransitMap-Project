<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:28px;overflow:auto;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:24px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;}
        .tbl{width:100%;border-collapse:collapse;font-size:13px;}
        .tbl th{text-align:left;padding:9px 14px;color:#888;font-weight:500;font-size:12px;border-bottom:1px solid #f0f0f0;}
        .tbl td{padding:12px 14px;border-bottom:1px solid #f9f9f9;color:#333;vertical-align:middle;}
        .tbl tr:last-child td{border-bottom:none;}
        .tbl tr:hover td{background:#fafafa;}
        .avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;
                justify-content:center;font-size:13px;font-weight:700;margin-right:10px;vertical-align:middle;}
        .badge{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;font-weight:500;}
        .r-admin{background:#EEEDFE;color:#3C3489;}
        .r-agent{background:#E6F1FB;color:#185FA5;}
        .r-voyageur{background:#EAF3DE;color:#3B6D11;}
        .status-active{color:#3B6D11;font-size:13px;font-weight:500;}
        .status-inactive{color:#A32D2D;font-size:13px;font-weight:500;}
        .sidebar-link:hover{background:rgba(255,255,255,0.08);color:white;}
        .sidebar-section-label{font-size:11px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:0 0 8px 10px;white-space:nowrap;}
        .sidebar-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0;}
        #sidebar.collapsed{width:60px;}
        #sidebar.collapsed .sidebar-text,#sidebar.collapsed .sidebar-section-label{opacity:0;pointer-events:none;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <div class="page-title">Gestion des utilisateurs</div>

            <div class="card">
                <table class="tbl">
                    <thead>
                        <tr>
                            <th>Utilisateur</th>
                            <th>Rôle</th>
                            <th>Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td>
                                <span class="avatar" style="background:#E6F1FB;color:#185FA5;"
                                      th:text="${u.username.substring(0,1).toUpperCase()}">
                                </span>
                                <span style="font-weight:500;" th:text="${u.username}"></span>
                            </td>
                            <td>
                                <span th:class="${u.role.name=='ADMIN'}?'badge r-admin':
                                                (${u.role.name=='AGENT'}?'badge r-agent':'badge r-voyageur')"
                                      th:text="${u.role.name}"></span>
                            </td>
                            <td>
                                <span th:if="${u.enabled}" class="status-active">● Actif</span>
                                <span th:unless="${u.enabled}" class="status-inactive">● Inactif</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
</body>
</html>
