<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Utilisateurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;}
        .card-box{background:white;border:1px solid #e0e0e0;border-radius:10px;padding:20px;margin-top:20px;}
        .role-admin{background:#EEEDFE;color:#3C3489;padding:3px 10px;border-radius:20px;font-size:12px;}
        .role-agent{background:#E6F1FB;color:#185FA5;padding:3px 10px;border-radius:20px;font-size:12px;}
        .role-voyageur{background:#EAF3DE;color:#3B6D11;padding:3px 10px;border-radius:20px;font-size:12px;}
        .avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;margin-right:8px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h5 style="font-weight:600;margin-bottom:16px;">Gestion des utilisateurs</h5>
    <div class="card-box">
        <table class="table table-borderless">
            <thead style="font-size:12px;color:#888;">
                <tr><th>Utilisateur</th><th>Rôle</th><th>Statut</th></tr>
            </thead>
            <tbody style="font-size:13px;">
                <tr th:each="u : ${users}">
                    <td>
                        <span class="avatar"
                              style="background:#E6F1FB;color:#185FA5;"
                              th:text="${u.username.substring(0,1).toUpperCase()}">
                        </span>
                        <span th:text="${u.username}"></span>
                    </td>
                    <td>
                        <span th:class="${u.role.name=='ADMIN'}?'role-admin':
                                        (${u.role.name=='AGENT'}?'role-agent':'role-voyageur')"
                              th:text="${u.role.name}"></span>
                    </td>
                    <td>
                        <span th:if="${u.enabled}"
                              style="color:#3B6D11;font-size:12px;">● Actif</span>
                        <span th:unless="${u.enabled}"
                              style="color:#A32D2D;font-size:12px;">● Inactif</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
