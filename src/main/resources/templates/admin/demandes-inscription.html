<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Demandes d'inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <div class="page-title">Demandes d'inscription</div>

            <!-- Stats rapides -->
            <div style="display:flex;gap:12px;margin-bottom:24px;">
                <div class="stat" style="flex:1;">
                    <div class="n" style="color:#BA7517;"
                         th:text="${enAttente}">0</div>
                    <div class="l">En attente</div>
                </div>
                <div class="stat" style="flex:1;">
                    <div class="n" style="color:#3B6D11;"
                         th:text="${demandes.size()}">0</div>
                    <div class="l">Total demandes</div>
                </div>
            </div>

            <div class="card">
                <div class="empty"
                     th:if="${#lists.isEmpty(demandes)}">
                    Aucune demande d'inscription.
                </div>

                <table class="tbl"
                       th:if="${!#lists.isEmpty(demandes)}">
                    <thead>
                        <tr>
                            <th>Demandeur</th>
                            <th>Entreprise</th>
                            <th>Type</th>
                            <th>Date</th>
                            <th>Statut</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${demandes}">
                            <td>
                                <div style="font-weight:500;"
                                     th:text="${d.nomComplet}"></div>
                                <div style="font-size:12px;color:#888;"
                                     th:text="${d.email}"></div>
                            </td>
                            <td>
                                <div th:text="${d.nomEntreprise}"></div>
                                <div style="font-size:11px;color:#888;"
                                     th:text="${d.telephone}"></div>
                            </td>
                            <td>
                                <span style="background:#E6F1FB;color:#185FA5;
                                             padding:2px 8px;border-radius:6px;
                                             font-size:11px;"
                                      th:text="${d.typeService}"></span>
                            </td>
                            <td style="font-size:12px;"
                                th:text="${#temporals.format(
                                    d.dateCreation,'dd/MM/yyyy')}">
                            </td>
                            <td>
                                <span th:class="${d.statut.name()=='EN_ATTENTE'}
                                    ?'badge b-wait':
                                    (${d.statut.name()=='APPROUVEE'}
                                    ?'badge b-appr':'badge b-rej')"
                                      th:text="${d.statut}"></span>
                            </td>
                            <td>
                                <a th:href="@{/admin/demandes-inscription/{id}
                                    (id=${d.id})}"
                                   class="btn-sm btn-detail"
                                   style="margin-right:4px;">Voir</a>

                                <th:block
                                    th:if="${d.statut.name()=='EN_ATTENTE'}">
                                    <form th:action="@{/admin/demandes-inscription/
                                        {id}/approuver(id=${d.id})}"
                                          method="post" style="display:inline;">
                                        <button type="submit"
                                                class="btn-appr">✓</button>
                                    </form>
                                    <form th:action="@{/admin/demandes-inscription/
                                        {id}/rejeter(id=${d.id})}"
                                          method="post" style="display:inline;">
                                        <button type="submit"
                                                class="btn-rej">✗</button>
                                    </form>
                                </th:block>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
