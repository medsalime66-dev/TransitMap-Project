<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Activité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:28px;overflow:auto;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:24px;}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
        .stat{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:18px;text-align:center;}
        .stat .n{font-size:30px;font-weight:700;margin-bottom:4px;}
        .stat .l{font-size:12px;color:#888;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px;}
        .card-title{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:16px;}
        .activity-item{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #f5f5f5;}
        .activity-item:last-child{border-bottom:none;}
        .activity-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;}
        .b-active{background:#EAF3DE;color:#3B6D11;}
        .b-cours{background:#E6F1FB;color:#185FA5;}
        .b-plan{background:#F1EFE8;color:#5F5E5A;}
        .b-wait{background:#FAEEDA;color:#633806;}
        .b-appr{background:#EAF3DE;color:#3B6D11;}
        .b-rej{background:#FCEBEB;color:#A32D2D;}
        .empty{text-align:center;padding:24px;color:#aaa;font-size:13px;}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#a0aec0;font-size:14px;font-weight:500;text-decoration:none;margin-bottom:3px;white-space:nowrap;}
        .sidebar-link:hover{background:rgba(255,255,255,0.08);color:white;}
        .sidebar-section-label{font-size:11px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:0 0 8px 10px;white-space:nowrap;}
        .sidebar-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0;}
        #sidebar.collapsed{width:60px;}
        #sidebar.collapsed .sidebar-text,#sidebar.collapsed .sidebar-section-label{opacity:0;pointer-events:none;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <div class="page-title">Activité du système</div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="n" style="color:#185FA5;" th:text="${totalLignes}">0</div>
                    <div class="l">Lignes actives</div>
                </div>
                <div class="stat">
                    <div class="n" style="color:#BA7517;" th:text="${totalVehicules}">0</div>
                    <div class="l">Véhicules</div>
                </div>
                <div class="stat">
                    <div class="n" style="color:#3B6D11;" th:text="${trajetsAujourdhui.size()}">0</div>
                    <div class="l">Trajets aujourd'hui</div>
                </div>
                <div class="stat">
                    <div class="n" style="color:#7F77DD;" th:text="${demandesEnAttente}">0</div>
                    <div class="l">Demandes en attente</div>
                </div>
            </div>

            <!-- Trajets du jour -->
            <div class="card">
                <div class="card-title">Trajets d'aujourd'hui</div>
                <div class="empty" th:if="${#lists.isEmpty(trajetsAujourdhui)}">
                    Aucun trajet aujourd'hui.
                </div>
                <div th:each="t : ${trajetsAujourdhui}" class="activity-item">
                    <div class="activity-icon" style="background:#E6F1FB;">🚌</div>
                    <div style="flex:1;">
                        <div style="font-size:13px;font-weight:600;" th:text="${t.ligne.nom}"></div>
                        <div style="font-size:12px;color:#888;"
                             th:text="${t.heureDepart + ' → ' + t.heureArrivee}"></div>
                    </div>
                    <span th:class="${t.statut=='ACTIVE'}?'badge b-active':
                                    (${t.statut=='EN_COURS'}?'badge b-cours':'badge b-plan')"
                          th:text="${t.statut}"></span>
                </div>
            </div>

            <!-- Historique demandes -->
            <div th:each="d : ${demandes}" class="activity-item">
                <div class="activity-icon" style="background:#EEEDFE;">📋</div>
                <div style="flex:1;">
                    <div style="font-size:13px;font-weight:600;"
                        th:text="${d.nomComplet + ' — ' + d.nomEntreprise}"></div>
                    <div style="font-size:12px;color:#888;"
                        th:text="${#temporals.format(
                            d.dateCreation,'dd/MM/yyyy HH:mm')}"></div>
                </div>
                <span th:class="${d.statut.name()=='EN_ATTENTE'}?'badge b-wait':
                                (${d.statut.name()=='APPROUVEE'}
                                ?'badge b-appr':'badge b-rej')"
                    th:text="${d.statut}"></span>
            </div>

        </div>
    </div>
</div>
</body>
</html>
