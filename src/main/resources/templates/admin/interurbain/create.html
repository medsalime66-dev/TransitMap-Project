<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle ligne interurbaine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        body{font-family:sans-serif;background:#f5f7fa;}
        .layout{display:flex;min-height:100vh;flex-direction:column;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:24px;}
        .page-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:20px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:28px;max-width:600px;}
        .form-label{font-size:13px;color:#555;margin-bottom:5px;display:block;}
        .form-control,.form-select{width:100%;padding:9px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;margin-bottom:4px;}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
        .btn-submit{background:#185FA5;color:white;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer;}
        .btn-cancel{color:#888;font-size:13px;text-decoration:none;margin-left:14px;}
        .text-danger{font-size:12px;color:#E24B4A;}
        .villes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px;}
        .ville-chip{padding:5px 10px;border:1px solid #e0e0e0;border-radius:6px;font-size:12px;cursor:pointer;text-align:center;color:#555;}
        .ville-chip:hover{background:#E6F1FB;border-color:#B5D4F4;color:#185FA5;}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#a0aec0;font-size:14px;font-weight:500;text-decoration:none;margin-bottom:3px;white-space:nowrap;transition:background 0.15s,color 0.15s;}
        .sidebar-link:hover{background:rgba(255,255,255,0.08);color:white;}
        .sidebar-section-label{font-size:11px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:0 0 8px 10px;white-space:nowrap;}
        .sidebar-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
        .sidebar-text{transition:opacity 0.2s;}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0;}
        #sidebar.collapsed{width:60px;}
        #sidebar.collapsed .sidebar-text,#sidebar.collapsed .sidebar-section-label{opacity:0;pointer-events:none;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">
            <div class="page-title">Nouvelle ligne interurbaine</div>
            <div class="card">
                <form th:action="@{/admin/interurbain/create}" th:object="${ligne}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Nom de la ligne</label>
                        <input type="text" th:field="*{nom}" class="form-control"
                               placeholder="ex: Nouakchott — Nouadhibou Express">
                        <div class="text-danger" th:errors="*{nom}"></div>
                    </div>

                    <div class="form-row mb-3">
                        <div>
                            <label class="form-label">Ville départ</label>
                            <select th:field="*{villeDepart}" class="form-select">
                                <option value="">-- Choisir --</option>
                                <option value="Nouakchott">Nouakchott</option>
                                <option value="Nouadhibou">Nouadhibou</option>
                                <option value="Rosso">Rosso</option>
                                <option value="Kaédi">Kaédi</option>
                                <option value="Zouerate">Zouerate</option>
                                <option value="Atar">Atar</option>
                                <option value="Tidjikja">Tidjikja</option>
                                <option value="Kiffa">Kiffa</option>
                                <option value="Sélibaby">Sélibaby</option>
                                <option value="Néma">Néma</option>
                                <option value="Aleg">Aleg</option>
                                <option value="Boutilimit">Boutilimit</option>
                                <option value="Akjoujt">Akjoujt</option>
                                <option value="Ouadane">Ouadane</option>
                                <option value="Chinguetti">Chinguetti</option>
                            </select>
                            <div class="text-danger" th:errors="*{villeDepart}"></div>
                        </div>
                        <div>
                            <label class="form-label">Ville arrivée</label>
                            <select th:field="*{villeArrivee}" class="form-select">
                                <option value="">-- Choisir --</option>
                                <option value="Nouakchott">Nouakchott</option>
                                <option value="Nouadhibou">Nouadhibou</option>
                                <option value="Rosso">Rosso</option>
                                <option value="Kaédi">Kaédi</option>
                                <option value="Zouerate">Zouerate</option>
                                <option value="Atar">Atar</option>
                                <option value="Tidjikja">Tidjikja</option>
                                <option value="Kiffa">Kiffa</option>
                                <option value="Sélibaby">Sélibaby</option>
                                <option value="Néma">Néma</option>
                                <option value="Aleg">Aleg</option>
                                <option value="Boutilimit">Boutilimit</option>
                                <option value="Akjoujt">Akjoujt</option>
                                <option value="Ouadane">Ouadane</option>
                                <option value="Chinguetti">Chinguetti</option>
                            </select>
                            <div class="text-danger" th:errors="*{villeArrivee}"></div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                    </div>

                    <button type="submit" class="btn-submit">Créer la ligne</button>
                    <a th:href="@{/admin/interurbain}" class="btn-cancel">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
