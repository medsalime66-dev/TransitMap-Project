<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail ligne interurbaine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{font-family:sans-serif;background:#f5f7fa;}
        .layout{display:flex;min-height:100vh;flex-direction:column;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:24px;}
        .back{font-size:13px;color:#185FA5;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;}
        .ligne-header{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
        .route-display{display:flex;align-items:center;gap:12px;}
        .city-badge{background:#1a1a2e;color:white;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;}
        .arrow{font-size:20px;color:#aaa;}
        .meta{font-size:13px;color:#888;margin-top:4px;}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:20px;}
        .card-title{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:14px;}
        .form-label{font-size:12px;color:#666;margin-bottom:4px;display:block;}
        .form-control,.form-select{width:100%;padding:8px 11px;border:1px solid #e0e0e0;border-radius:7px;font-size:13px;margin-bottom:3px;}
        .btn-sm-add{background:#185FA5;color:white;border:none;padding:8px 16px;border-radius:7px;font-size:12px;cursor:pointer;width:100%;margin-top:8px;}
        .tbl{width:100%;border-collapse:collapse;font-size:13px;}
        .tbl th{padding:8px 10px;color:#888;font-weight:500;font-size:11px;text-align:left;border-bottom:1px solid #f0f0f0;}
        .tbl td{padding:9px 10px;border-bottom:1px solid #f9f9f9;color:#333;}
        .tbl tr:last-child td{border-bottom:none;}
        .btn-del-sm{background:#FCEBEB;color:#A32D2D;border:none;padding:3px 10px;border-radius:5px;font-size:11px;cursor:pointer;text-decoration:none;}
        .stop-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f5f5f5;}
        .stop-line:last-child{border-bottom:none;}
        .stop-dot{width:12px;height:12px;border-radius:50%;background:#185FA5;border:2px solid white;box-shadow:0 0 0 2px #185FA5;flex-shrink:0;}
        .jours-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
        .jour-chip{padding:3px 8px;border-radius:5px;font-size:11px;border:1px solid #e0e0e0;cursor:pointer;color:#555;}
        .jour-chip.selected{background:#185FA5;color:white;border-color:#185FA5;}
        .text-danger{font-size:11px;color:#E24B4A;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <a th:href="@{/admin/interurbain}" class="back">← Retour aux lignes</a>

            <!-- Header -->
            <div class="ligne-header">
                <div class="route-display">
                    <span class="city-badge" th:text="${ligne.villeDepart}"></span>
                    <span class="arrow">→</span>
                    <span class="city-badge" th:text="${ligne.villeArrivee}"></span>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:16px;font-weight:600;" th:text="${ligne.nom}"></div>
                    <div class="meta"
                         th:text="${ligne.distanceKm + ' km · Prix base : ' + ligne.prixBase + ' MRU'}">
                    </div>
                </div>
            </div>

            <div class="grid2">

                <!-- Horaires -->
                <div>
                    <div class="card">
                        <div class="card-title">Horaires de départ</div>
                        <div th:if="${#lists.isEmpty(ligne.horaires)}"
                             style="color:#aaa;font-size:12px;text-align:center;padding:14px 0;">
                            Aucun horaire.
                        </div>
                        <table class="tbl" th:if="${!#lists.isEmpty(ligne.horaires)}">
                            <thead>
                                <tr><th>Départ</th><th>Arrivée</th><th>Jours</th><th>Prix</th><th></th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="h : ${ligne.horaires}">
                                    <td style="font-weight:600;" th:text="${h.heureDepart}"></td>
                                    <td th:text="${h.heureArrivee}"></td>
                                    <td style="font-size:11px;color:#888;" th:text="${h.jours}"></td>
                                    <td style="color:#185FA5;font-weight:600;" th:text="${h.prix + ' MRU'}"></td>
                                    <td>
                                        <a th:href="@{/admin/interurbain/horaires/{id}/delete(id=${h.id},ligneId=${ligne.id})}"
                                           class="btn-del-sm">✕</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Ajouter horaire -->
                    <div class="card">
                        <div class="card-title">Ajouter un horaire</div>
                        <form th:action="@{/admin/interurbain/{id}/horaires/add(id=${ligne.id})}"
                              th:object="${horaire}" method="post">
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                                <div>
                                    <label class="form-label">Heure départ</label>
                                    <input type="time" th:field="*{heureDepart}" class="form-control">
                                    <div class="text-danger" th:errors="*{heureDepart}"></div>
                                </div>
                                <div>
                                    <label class="form-label">Heure arrivée</label>
                                    <input type="time" th:field="*{heureArrivee}" class="form-control">
                                    <div class="text-danger" th:errors="*{heureArrivee}"></div>
                                </div>
                            </div>
                            <div style="margin:10px 0;">
                                <label class="form-label">Jours</label>
                                <select th:field="*{jours}" class="form-select">
                                    <option value="QUOTIDIEN">Tous les jours</option>
                                    <option value="LUNDI,MERCREDI,VENDREDI">Lun / Mer / Ven</option>
                                    <option value="MARDI,JEUDI,SAMEDI">Mar / Jeu / Sam</option>
                                    <option value="SAMEDI,DIMANCHE">Week-end</option>
                                    <option value="LUNDI,MARDI,MERCREDI,JEUDI,VENDREDI">Jours ouvrables</option>
                                </select>
                                <div class="text-danger" th:errors="*{jours}"></div>
                            </div>
                            <div>
                                <label class="form-label">Prix (MRU)</label>
                                <input type="number" step="50" th:field="*{prix}" class="form-control"
                                       th:value="${ligne.prixBase}">
                                <div class="text-danger" th:errors="*{prix}"></div>
                            </div>
                            <button type="submit" class="btn-sm-add">+ Ajouter cet horaire</button>
                        </form>
                    </div>
                </div>

                <!-- Etapes -->
                <div>
                    <div class="card">
                        <div class="card-title">Villes étapes</div>
                        <div th:if="${#lists.isEmpty(ligne.etapes)}"
                             style="color:#aaa;font-size:12px;text-align:center;padding:14px 0;">
                            Aucune étape.
                        </div>
                        <div th:each="e : ${ligne.etapes}" class="stop-line">
                            <div class="stop-dot"></div>
                            <div style="flex:1;">
                                <div style="font-size:13px;font-weight:500;" th:text="${e.nomVille}"></div>
                                <div style="font-size:11px;color:#888;"
                                     th:text="${'+' + e.dureeDepuisDebut + ' min depuis départ'}"></div>
                            </div>
                            <a th:href="@{/admin/interurbain/etapes/{id}/delete(id=${e.id},ligneId=${ligne.id})}"
                               class="btn-del-sm">✕</a>
                        </div>
                    </div>

                    <!-- Ajouter étape -->
                    <div class="card">
                        <div class="card-title">Ajouter une ville étape</div>
                        <form th:action="@{/admin/interurbain/{id}/etapes/add(id=${ligne.id})}"
                              th:object="${etape}" method="post">
                            <div>
                                <label class="form-label">Ville</label>
                                <select th:field="*{nomVille}" class="form-select">
                                    <option value="">-- Choisir --</option>
                                    <option value="Nouakchott">Nouakchott</option>
                                    <option value="Nouadhibou">Nouadhibou</option>
                                    <option value="Rosso">Rosso</option>
                                    <option value="Kaédi">Kaédi</option>
                                    <option value="Zouerate">Zouerate</option>
                                    <option value="Atar">Atar</option>
                                    <option value="Tidjikja">Tidjikja</option>
                                    <option value="Kiffa">Kiffa</option>
                                    <option value="Sélibaby">Sélibaby</option>
                                    <option value="Néma">Néma</option>
                                    <option value="Aleg">Aleg</option>
                                    <option value="Boutilimit">Boutilimit</option>
                                    <option value="Akjoujt">Akjoujt</option>
                                </select>
                                <div class="text-danger" th:errors="*{nomVille}"></div>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                                <div>
                                    <label class="form-label">Latitude</label>
                                    <input type="number" step="0.0001" th:field="*{latitude}" class="form-control">
                                </div>
                                <div>
                                    <label class="form-label">Longitude</label>
                                    <input type="number" step="0.0001" th:field="*{longitude}" class="form-control">
                                </div>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
                                <div>
                                    <label class="form-label">Ordre</label>
                                    <input type="number" th:field="*{ordre}" class="form-control">
                                </div>
                                <div>
                                    <label class="form-label">Durée depuis départ (min)</label>
                                    <input type="number" th:field="*{dureeDepuisDebut}" class="form-control">
                                </div>
                            </div>
                            <button type="submit" class="btn-sm-add">+ Ajouter cette étape</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
