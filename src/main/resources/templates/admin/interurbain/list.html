<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lignes Interurbaines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{font-family:sans-serif;background:#f5f7fa;}
        .layout{display:flex;min-height:100vh;flex-direction:column;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:24px;}
        .page-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:20px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
        .card-title{font-size:14px;font-weight:600;color:#1a1a2e;}
        .btn-add{background:#185FA5;color:white;border:none;padding:8px 18px;border-radius:8px;font-size:13px;text-decoration:none;}
        .tbl{width:100%;border-collapse:collapse;font-size:13px;}
        .tbl th{text-align:left;padding:10px 14px;color:#888;font-weight:500;font-size:12px;border-bottom:1px solid #f0f0f0;}
        .tbl td{padding:12px 14px;border-bottom:1px solid #f9f9f9;color:#333;}
        .tbl tr:last-child td{border-bottom:none;}
        .tbl tr:hover td{background:#fafafa;}
        .btn-sm{padding:4px 12px;border-radius:6px;font-size:12px;border:none;cursor:pointer;text-decoration:none;}
        .btn-detail{background:#E6F1FB;color:#0C447C;}
        .btn-del{background:#FCEBEB;color:#A32D2D;}
        .route{display:flex;align-items:center;gap:8px;font-weight:500;}
        .city{background:#f0f4f8;padding:3px 10px;border-radius:6px;font-size:12px;}
        .arrow{color:#aaa;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">
            <div class="page-title">Lignes interurbaines</div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Toutes les lignes</div>
                    <a th:href="@{/admin/interurbain/create}" class="btn-add">+ Nouvelle ligne</a>
                </div>
                <div th:if="${#lists.isEmpty(lignes)}"
                     style="text-align:center;padding:40px;color:#aaa;font-size:13px;">
                    Aucune ligne interurbaine. Créez la première !
                </div>
                <table class="tbl" th:if="${!#lists.isEmpty(lignes)}">
                    <thead>
                        <tr>
                            <th>Route</th>
                            <th>Distance</th>
                            <th>Prix de base</th>
                            <th>Départs / jour</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="l : ${lignes}">
                            <td>
                                <div class="route">
                                    <span class="city" th:text="${l.villeDepart}"></span>
                                    <span class="arrow">→</span>
                                    <span class="city" th:text="${l.villeArrivee}"></span>
                                </div>
                                <div style="font-size:11px;color:#888;margin-top:3px;" th:text="${l.nom}"></div>
                            </td>
                            <td th:text="${l.distanceKm + ' km'}"></td>
                            <td style="font-weight:600;color:#185FA5;" th:text="${l.prixBase + ' MRU'}"></td>
                            <td>
                                <span th:if="${l.horaires != null}"
                                      th:text="${#lists.size(l.horaires) + ' départ(s)'}"></span>
                                <span th:unless="${l.horaires != null}">0 départ</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/interurbain/{id}(id=${l.id})}"
                                   class="btn-sm btn-detail" style="margin-right:6px;">Gérer</a>
                                <a th:href="@{/admin/interurbain/{id}/delete(id=${l.id})}"
                                   class="btn-sm btn-del"
                                   onclick="return confirm('Supprimer cette ligne ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
