<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Arrets</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
<a th:href="@{/arrets/create}" class="btn btn-success mb-3">Ajouter</a>
<table class="table table-bordered">
<thead><tr><th>ID</th><th>Nom</th><th>Lat</th><th>Lng</th><th>Ordre</th><th>Actions</th></tr></thead>
<tbody>
<tr th:each="a:${arrets}">
<td th:text="${a.id}"></td>
<td th:text="${a.nom}"></td>
<td th:text="${a.latitude}"></td>
<td th:text="${a.longitude}"></td>
<td th:text="${a.ordre}"></td>
<td>
<a th:href="@{/arrets/edit/{id}(id=${a.id})}" class="btn btn-warning btn-sm">Edit</a>
<a th:href="@{/arrets/delete/{id}(id=${a.id})}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
</tbody>
</table>
</div>
</body>
</html>
