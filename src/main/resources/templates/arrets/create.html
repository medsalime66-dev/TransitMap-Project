<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Create Arret</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
<form th:action="@{/arrets/create}" th:object="${arret}" method="post">
<input th:field="*{nom}" class="form-control mb-2" placeholder="Nom">
<input th:field="*{latitude}" class="form-control mb-2" placeholder="Latitude">
<input th:field="*{longitude}" class="form-control mb-2" placeholder="Longitude">
<input th:field="*{ordre}" class="form-control mb-2" placeholder="Ordre">
<select th:field="*{ligneId}" class="form-select mb-3">
<option th:each="l:${lignes}" th:value="${l.id}" th:text="${l.nom}"></option>
</select>
<button class="btn btn-success">Save</button>
</form>
</div>
</body>
</html>
