<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Create Vehicule</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
<form th:action="@{/vehicules/create}" th:object="${vehicule}" method="post">
<input th:field="*{matricule}" class="form-control mb-2" placeholder="Matricule">
<input th:field="*{capacite}" class="form-control mb-2" placeholder="Capacite">
<input th:field="*{statut}" class="form-control mb-2" placeholder="Statut">
<input th:field="*{currentLatitude}" class="form-control mb-2" placeholder="Latitude">
<input th:field="*{currentLongitude}" class="form-control mb-2" placeholder="Longitude">
<select th:field="*{ligneId}" class="form-select mb-3">
<option th:each="l:${lignes}" th:value="${l.id}" th:text="${l.nom}"></option>
</select>
<button class="btn btn-success">Save</button>
</form>
</div>
</body>
</html>
