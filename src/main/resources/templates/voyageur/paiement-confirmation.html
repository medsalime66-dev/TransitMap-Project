<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmer le paiement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .content{flex:1;padding:28px;max-width:480px;margin:0 auto;width:100%;}
        .page-title{font-size:18px;font-weight:700;color:#1a1a2e;
                    margin-bottom:20px;}
        .methode-header{display:flex;align-items:center;gap:12px;
                        margin-bottom:20px;}
        .methode-logo{font-size:32px;}
        .methode-nom{font-size:16px;font-weight:700;color:#1a1a2e;}
        .card-instruction{background:white;border:1px solid #e5e7eb;
                          border-radius:12px;padding:20px;
                          margin-bottom:16px;}
        .instr-ligne{display:flex;align-items:flex-start;gap:10px;
                     padding:6px 0;font-size:13px;color:#555;}
        .instr-num{width:22px;height:22px;background:#185FA5;color:white;
                   border-radius:50%;display:flex;align-items:center;
                   justify-content:center;font-size:11px;font-weight:700;
                   flex-shrink:0;margin-top:1px;}
        .card-code{background:white;border:1px solid #e5e7eb;
                   border-radius:12px;padding:20px;margin-bottom:16px;}
        .label-code{font-size:12px;color:#888;margin-bottom:8px;}
        .code-commerçant{font-size:28px;font-weight:700;
                          font-family:monospace;color:#1a1a2e;
                          letter-spacing:4px;display:flex;
                          align-items:center;gap:12px;}
        .btn-copier{background:#f0f4f8;border:none;padding:6px 12px;
                    border-radius:6px;font-size:12px;cursor:pointer;
                    color:#185FA5;font-weight:600;}
        .montant-note{font-size:13px;color:#888;margin-top:6px;}
        .card-saisie{background:white;border:1px solid #e5e7eb;
                     border-radius:12px;padding:20px;margin-bottom:16px;}
        .form-label{font-size:13px;color:#555;margin-bottom:4px;display:block;}
        .form-control{width:100%;padding:10px 14px;border:1px solid #e0e0e0;
                      border-radius:8px;font-size:15px;font-family:monospace;
                      letter-spacing:2px;}
        .form-control:focus{border-color:#185FA5;
                            box-shadow:0 0 0 3px rgba(24,95,165,0.1);
                            outline:none;}
        .btn-confirmer{width:100%;background:#1D9E75;color:white;border:none;
                       padding:12px;border-radius:9px;font-size:15px;
                       font-weight:600;cursor:pointer;margin-top:8px;}
        .btn-confirmer:hover{background:#0F6E56;}
        .btn-annuler{width:100%;background:white;color:#888;
                     border:1px solid #e0e0e0;padding:10px;
                     border-radius:9px;font-size:14px;cursor:pointer;
                     margin-top:8px;text-decoration:none;display:block;
                     text-align:center;}
        .back{font-size:13px;color:#185FA5;text-decoration:none;
              display:inline-flex;align-items:center;gap:6px;
              margin-bottom:16px;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="content">

        <a th:href="@{/voyageur/paiement/{id}(id=${reservation.id})}"
           class="back">← Changer de méthode</a>

        <div class="page-title">Paiement</div>

        <!-- En-tête méthode -->
        <div class="methode-header">
            <div class="methode-logo">🏦</div>
            <div class="methode-nom" th:text="${methode}"></div>
        </div>

        <!-- Instructions -->
        <div class="card-instruction">
            <div class="instr-ligne">
                <div class="instr-num">1</div>
                <div>Copiez le code commerçant ci-dessous</div>
            </div>
            <div class="instr-ligne">
                <div class="instr-num">2</div>
                <div>Ouvrez l'application
                    <strong th:text="${methode}"></strong>
                    et effectuez le paiement avec ce code
                </div>
            </div>
            <div class="instr-ligne">
                <div class="instr-num">3</div>
                <div>Revenez ici et saisissez le code de confirmation
                    reçu après le paiement
                </div>
            </div>
        </div>

        <!-- Code commerçant -->
        <div class="card-code">
            <div class="label-code">Code commerçant</div>
            <div class="code-commerçant">
                <span id="codeAffiche"
                      th:text="${codeCommerçant != null and
                                  !#strings.isEmpty(codeCommerçant) ?
                                  codeCommerçant : '—'}">
                </span>
                <button class="btn-copier"
                        onclick="copierCode()"
                        th:if="${codeCommerçant != null and
                                 !#strings.isEmpty(codeCommerçant)}">
                    Copier
                </button>
            </div>
            <div class="montant-note"
                 th:if="${reservation.montant != null}">
                Montant :
                <strong th:text="${reservation.montant + ' MRU'}"></strong>
            </div>
            <div class="montant-note"
                 style="color:#A32D2D;"
                 th:if="${codeCommerçant == null or
                          #strings.isEmpty(codeCommerçant)}">
                Code non disponible pour cette méthode
            </div>
        </div>

        <!-- Saisie du code reçu -->
        <div class="card-saisie">
            <form th:action="@{/voyageur/paiement/{id}/valider
                (id=${reservation.id})}" method="post">
                <input type="hidden" name="methode"
                       th:value="${methode}">

                <label class="form-label">
                    Code reçu après paiement *
                </label>
                <input type="text" name="codeTransaction"
                       class="form-control"
                       placeholder="Saisissez le code de confirmation"
                       required autocomplete="off">

                <button type="submit" class="btn-confirmer">
                    ✓ Confirmer le paiement
                </button>
            </form>

            <a th:href="@{/voyageur/paiement/{id}(id=${reservation.id})}"
               class="btn-annuler">
                Annuler
            </a>
        </div>

    </div>
</div>

<script>
function copierCode() {
    const code = document.getElementById('codeAffiche').textContent.trim();
    navigator.clipboard.writeText(code).then(() => {
        const btn = document.querySelector('.btn-copier');
        btn.textContent = '✓ Copié';
        setTimeout(() => btn.textContent = 'Copier', 2000);
    });
}
</script>
</body>
</html>
