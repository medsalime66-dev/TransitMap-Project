<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ma réservation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .content{flex:1;padding:28px;max-width:480px;margin:0 auto;width:100%;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;
                    margin-bottom:24px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;
              padding:20px;margin-bottom:16px;}
        .card-title{font-size:14px;font-weight:600;color:#1a1a2e;
                    margin-bottom:14px;}
        .statut-badge{display:inline-block;padding:6px 16px;border-radius:20px;
                      font-size:13px;font-weight:600;margin-bottom:16px;}
        .s-confirme{background:#EAF3DE;color:#3B6D11;}
        .s-attente{background:#FAEEDA;color:#633806;}
        .s-utilise{background:#F1EFE8;color:#5F5E5A;}
        .s-annule{background:#FCEBEB;color:#A32D2D;}
        .info-row{display:flex;align-items:center;padding:8px 0;
                  border-bottom:1px solid #f5f5f5;font-size:13px;}
        .info-row:last-child{border-bottom:none;}
        .info-lbl{color:#888;width:130px;flex-shrink:0;}
        .info-val{color:#1a1a2e;font-weight:500;}
        .qr-zone{text-align:center;padding:20px 0;}
        .qr-container{display:inline-block;padding:16px;background:white;
                      border:2px solid #e0e0e0;border-radius:12px;}
        .code-texte-zone{margin-top:16px;}
        .code-texte-label{font-size:12px;color:#888;margin-bottom:8px;
                          text-align:center;}
        .code-texte{font-size:32px;font-weight:700;font-family:monospace;
                    letter-spacing:6px;color:#1a1a2e;text-align:center;
                    background:#f9fafb;border:2px solid #e0e0e0;
                    border-radius:10px;padding:14px;}
        .btn-annuler{width:100%;background:white;color:#A32D2D;
                     border:1px solid #F09595;padding:10px;border-radius:9px;
                     font-size:14px;cursor:pointer;margin-top:4px;}
        .btn-retour{display:block;background:#185FA5;color:white;
                    padding:11px;border-radius:9px;text-align:center;
                    text-decoration:none;font-size:14px;font-weight:600;
                    margin-bottom:10px;}
        .back{font-size:13px;color:#185FA5;text-decoration:none;
              display:inline-flex;align-items:center;gap:6px;
              margin-bottom:16px;}
        .non-disponible{text-align:center;padding:24px;color:#aaa;
                        font-size:13px;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="content">

        <a href="/voyageur/reservations" class="back">
            ← Mes réservations
        </a>
        <div class="page-title">Détail de la réservation</div>

        <!-- Statut -->
        <span th:class="${reservation.statut.name()=='CONFIRME'}
            ?'statut-badge s-confirme':
            (${reservation.statut.name()=='EN_ATTENTE'}
            ?'statut-badge s-attente':
            (${reservation.statut.name()=='UTILISE'}
            ?'statut-badge s-utilise':'statut-badge s-annule'))"
              th:text="${reservation.statut}"></span>

        <!-- Informations trajet -->
        <div class="card">
            <div class="card-title">Informations du trajet</div>
            <div class="info-row">
                <span class="info-lbl">Ligne</span>
                <span class="info-val"
                      th:text="${reservation.ligneNom}"></span>
            </div>
            <div class="info-row">
                <span class="info-lbl">Date</span>
                <span class="info-val"
                      th:text="${reservation.dateTrajet}"></span>
            </div>
            <div class="info-row">
                <span class="info-lbl">Départ</span>
                <span class="info-val"
                      th:text="${reservation.heureDepart}"></span>
            </div>
            <div class="info-row">
                <span class="info-lbl">De</span>
                <span class="info-val"
                      th:text="${reservation.arretDepartNom}"></span>
            </div>
            <div class="info-row">
                <span class="info-lbl">À</span>
                <span class="info-val"
                      th:text="${reservation.arretArriveeNom}"></span>
            </div>
            <div class="info-row"
                 th:if="${reservation.montant != null}">
                <span class="info-lbl">Montant payé</span>
                <span class="info-val" style="color:#1D9E75;font-weight:700;"
                      th:text="${reservation.montant + ' MRU'}"></span>
            </div>
        </div>

        <!-- QR Code + Code texte (si confirmé) -->
        <div class="card"
             th:if="${reservation.statut.name() == 'CONFIRME' or
                      reservation.statut.name() == 'UTILISE'}">
            <div class="card-title">Mon ticket</div>

            <!-- QR Code généré dynamiquement -->
            <div class="qr-zone"
                 th:if="${reservation.codeQR != null}">
                <div class="qr-container">
                    <div id="qrcode"></div>
                </div>
            </div>

            <div class="non-disponible"
                 th:unless="${reservation.codeQR != null}">
                QR code non disponible
            </div>

            <!-- Code textuel -->
            <div class="code-texte-zone"
                 th:if="${reservation.codeTexte != null}">
                <div class="code-texte-label">
                    Code de validation manuelle
                </div>
                <div class="code-texte"
                     th:text="${reservation.codeTexte}"></div>
            </div>

            <!-- Utilisé -->
            <div th:if="${reservation.statut.name() == 'UTILISE'}"
                 style="text-align:center;margin-top:14px;font-size:13px;
                        color:#5F5E5A;">
                ✓ Ce ticket a déjà été utilisé
            </div>
        </div>

        <!-- En attente de paiement -->
        <div class="card"
             th:if="${reservation.statut.name() == 'EN_ATTENTE'}">
            <div style="text-align:center;padding:16px;">
                <div style="font-size:32px;margin-bottom:8px;">⏳</div>
                <div style="font-size:14px;color:#888;">
                    En attente de paiement
                </div>
                <a th:href="@{/voyageur/paiement/{id}
                    (id=${reservation.id})}"
                   style="display:inline-block;margin-top:12px;
                          background:#185FA5;color:white;padding:9px 24px;
                          border-radius:8px;text-decoration:none;
                          font-size:14px;font-weight:600;">
                    Payer maintenant →
                </a>
            </div>
        </div>

        <!-- Boutons -->
        <a href="/voyageur/reservations" class="btn-retour">
            ← Retour à mes réservations
        </a>

        <form th:if="${reservation.statut.name() == 'EN_ATTENTE'}"
              th:action="@{/voyageur/reservations/annuler/
                  {id}(id=${reservation.id})}"
              method="post">
            <button type="submit" class="btn-annuler"
                    onclick="return confirm(
                        'Annuler cette réservation ?')">
                Annuler la réservation
            </button>
        </form>

    </div>
</div>

<script th:inline="javascript">
    const codeQR = /*[[${reservation.codeQR}]]*/ null;
    if (codeQR) {
        new QRCode(document.getElementById("qrcode"), {
            text: codeQR,
            width: 180,
            height: 180,
            colorDark: "#0f1729",
            colorLight: "#ffffff"
        });
    }
</script>
</body>
</html>
