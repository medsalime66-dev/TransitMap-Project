<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trajets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .trajet-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .trajet-info .route { font-size: 15px; font-weight: 600; color: #1a1a2e; }
        .trajet-info .time { font-size: 13px; color: #888; margin-top: 3px; }
        .badge-active { background: #EAF3DE; color: #3B6D11; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge-inactive { background: #F1EFE8; color: #5F5E5A; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .badge-progress { background: #E6F1FB; color: #185FA5; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: #185FA5; font-size: 13px; text-decoration: none;
            margin-bottom: 16px;
        }
        .back-btn:hover { color: #0C447C; }
        .ligne-header {
            background: white;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            padding: 16px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .ligne-badge {
            background: #185FA5;
            color: white;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 15px;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <a href="/map" class="back-btn">← Retour à la carte</a>

    <!-- رأس الخط -->
    <div class="ligne-header">
        <div class="ligne-badge" th:text="${ligne.numero}">L01</div>
        <div>
            <div style="font-size:16px;font-weight:600;" th:text="${ligne.nom}">Ligne Nord</div>
            <div style="font-size:13px;color:#888;" th:text="${ligne.description}"></div>
        </div>
    </div>

    <!-- لا توجد رحلات -->
    <div th:if="${#lists.isEmpty(trajets)}"
         style="text-align:center;padding:40px;color:#888;background:white;border-radius:10px;border:1px solid #e0e0e0;">
        Aucun trajet disponible pour cette ligne.
    </div>

    <!-- قائمة الرحلات -->
    <div th:each="t : ${trajets}" class="trajet-card">
        <div class="trajet-info">
            <div class="route"
                 th:text="${#temporals.format(t.dateTrajet, 'dd/MM/yyyy')}">
            </div>
            <div class="time"
                 th:text="${'Départ : ' + t.heureDepart + '  →  Arrivée : ' + t.heureArrivee}">
            </div>
        </div>
        <span th:classappend="${t.statut == 'ACTIVE'} ? 'badge-active' :
                              (${t.statut == 'EN_COURS'} ? 'badge-progress' : 'badge-inactive')"
              th:text="${t.statut}">
        </span>
    </div>

</div>
</body>
</html>
