<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trajets disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;}
        .trajet-card{background:white;border:1px solid #e0e0e0;
                     border-radius:10px;padding:16px 20px;
                     margin-bottom:10px;display:flex;
                     align-items:center;justify-content:space-between;}
        .trajet-info .route{font-size:15px;font-weight:600;color:#1a1a2e;}
        .trajet-info .time{font-size:13px;color:#888;margin-top:3px;}
        .trajet-info .places{font-size:12px;margin-top:4px;}
        .back-btn{display:inline-flex;align-items:center;gap:6px;
                  color:#185FA5;font-size:13px;text-decoration:none;
                  margin-bottom:16px;}
        .ligne-header{background:white;border-radius:10px;
                      border:1px solid #e0e0e0;padding:16px 20px;
                      margin-bottom:16px;display:flex;
                      align-items:center;gap:14px;}
        .ligne-badge{background:#185FA5;color:white;border-radius:8px;
                     padding:8px 16px;font-weight:600;font-size:15px;}
        .badge-planifie{background:#F1EFE8;color:#5F5E5A;
                        padding:4px 12px;border-radius:20px;font-size:12px;}
        .badge-active{background:#EAF3DE;color:#3B6D11;
                      padding:4px 12px;border-radius:20px;font-size:12px;}
        .badge-cours{background:#E6F1FB;color:#185FA5;
                     padding:4px 12px;border-radius:20px;font-size:12px;}
        .btn-reserver{background:#185FA5;color:white;border:none;
                      padding:8px 18px;border-radius:8px;font-size:13px;
                      font-weight:600;text-decoration:none;display:inline-block;}
        .btn-reserver:hover{background:#0C447C;color:white;}
        .btn-complet{background:#f5f5f5;color:#aaa;border:none;
                     padding:8px 14px;border-radius:8px;font-size:12px;
                     cursor:not-allowed;}
        .actions{display:flex;flex-direction:column;
                 align-items:flex-end;gap:6px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">

    <a href="/map" class="back-btn">← Retour à la carte</a>

    <!-- رأس الخط -->
    <div class="ligne-header">
        <div class="ligne-badge" th:text="${ligne.numero}">L01</div>
        <div>
            <div style="font-size:16px;font-weight:600;"
                 th:text="${ligne.nom}"></div>
            <div style="font-size:13px;color:#888;"
                 th:text="${ligne.description ?: ''}"></div>
        </div>
    </div>

    <!-- لا توجد رحلات -->
    <div th:if="${#lists.isEmpty(trajets)}"
         style="text-align:center;padding:40px;color:#888;
                background:white;border-radius:10px;
                border:1px solid #e0e0e0;">
        Aucun trajet disponible pour cette ligne.
    </div>

    <!-- قائمة الرحلات -->
    <div th:each="t : ${trajets}" class="trajet-card">
        <div class="trajet-info">
            <div class="route"
                 th:text="${#temporals.format(t.dateTrajet,'dd/MM/yyyy')}">
            </div>
            <div class="time"
                 th:text="${'Départ : ' + t.heureDepart +
                            '  →  Arrivée : ' + t.heureArrivee}">
            </div>
            <div class="places" th:if="${t.vehicule != null}">
                <span th:style="${t.vehicule.placesDisponibles == 0
                    ? 'color:#A32D2D;font-weight:600'
                    : 'color:#3B6D11;font-weight:600'}"
                      th:text="${t.vehicule.placesDisponibles
                                 + ' place(s) disponible(s)'}">
                </span>
            </div>
        </div>

        <div class="actions">
            <span th:class="${t.statut=='EN_COURS'}?'badge-cours':
                              (${t.statut=='ACTIVE'}
                              ?'badge-active':'badge-planifie')"
                  th:text="${t.statut}"></span>

            <a th:if="${t.vehicule != null and
                        t.vehicule.placesDisponibles > 0}"
               th:href="@{/voyageur/reservations/creer/{id}(id=${t.id})}"
               class="btn-reserver">
                Réserver →
            </a>
            <span th:if="${t.vehicule == null or
                           t.vehicule.placesDisponibles <= 0}"
                  class="btn-complet">
                Complet
            </span>
        </div>
    </div>

</div>
</body>
</html>
