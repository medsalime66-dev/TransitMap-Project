<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réserver un trajet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .content{flex:1;padding:28px;max-width:520px;margin:0 auto;width:100%;}
        .back{font-size:13px;color:#185FA5;text-decoration:none;
              display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
        .page-sub{font-size:13px;color:#888;margin-bottom:20px;}

        .recap{background:#0f1729;border-radius:10px;padding:14px 18px;
               color:white;margin-bottom:20px;}
        .recap .nom{font-size:15px;font-weight:700;}
        .recap .trajet{font-size:13px;color:#9fb0cc;margin-top:4px;}

        .alerte{background:#FCEBEB;color:#A32D2D;border:1px solid #F2C4C4;
                border-radius:9px;padding:10px 14px;font-size:13px;margin-bottom:16px;}

        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;
              padding:18px 20px;margin-bottom:16px;}
        .card-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;
                    letter-spacing:1px;margin-bottom:14px;}
        .form-label{font-size:13px;color:#555;margin-bottom:5px;display:block;font-weight:500;}
        .form-select,.form-control{width:100%;padding:10px 14px;border:1px solid #e0e0e0;
                      border-radius:8px;font-size:14px;margin-bottom:14px;background:white;}
        .form-select:focus,.form-control:focus{border-color:#185FA5;
                            box-shadow:0 0 0 3px rgba(24,95,165,0.1);outline:none;}

        .horaire-card{display:flex;align-items:center;justify-content:space-between;
                      gap:12px;padding:12px 16px;border:1px solid #e5e7eb;
                      border-radius:10px;cursor:pointer;margin-bottom:10px;
                      transition:border-color 0.15s,background 0.15s;}
        .horaire-card:hover{border-color:#185FA5;}
        .horaire-card input{margin:0;accent-color:#185FA5;}
        .horaire-card.actif{border-color:#185FA5;background:#E6F1FB;}
        .h-time{font-size:15px;font-weight:600;color:#1a1a2e;}
        .h-jours{font-size:12px;color:#888;margin-top:2px;}
        .h-prix{font-size:14px;font-weight:700;color:#1D9E75;white-space:nowrap;}

        .prix-box{background:#0f1729;border-radius:10px;padding:16px 20px;
                  display:flex;align-items:center;justify-content:space-between;
                  margin-bottom:16px;}
        .prix-lbl{font-size:13px;color:#9fb0cc;}
        .prix-val{font-size:24px;font-weight:700;color:#1D9E75;}
        .prix-note{font-size:12px;color:#A32D2D;margin-top:6px;}

        .btn-continuer{width:100%;background:#185FA5;color:white;border:none;
                       padding:13px;border-radius:9px;font-size:15px;font-weight:600;
                       cursor:pointer;}
        .btn-continuer:hover{background:#0C447C;}
        .btn-continuer:disabled{background:#c4cdd9;cursor:not-allowed;}
        .vide{text-align:center;padding:40px 20px;color:#aaa;font-size:14px;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="content">

        <a th:href="@{/map}" class="back">← Retour à la carte</a>
        <div class="page-title">Réserver un trajet</div>
        <div class="page-sub">Choisissez vos arrêts, l'horaire et la date</div>

        <!-- Récapitulatif ligne -->
        <div class="recap">
            <div class="nom" th:text="${ligne.nom}"></div>
            <div class="trajet"
                 th:text="${ligne.villeDepart + ' → ' + ligne.villeArrivee}"></div>
        </div>

        <!-- Message d'erreur (flash) -->
        <div class="alerte" th:if="${erreur}" th:text="${erreur}"></div>

        <!-- Aucun arrêt / horaire -->
        <div class="card"
             th:if="${#lists.isEmpty(ligne.etapes) or #lists.isEmpty(ligne.horaires)}">
            <div class="vide">
                Cette ligne n'a pas encore d'arrêts ou d'horaires disponibles.
            </div>
        </div>

        <!-- Formulaire -->
        <form th:unless="${#lists.isEmpty(ligne.etapes) or #lists.isEmpty(ligne.horaires)}"
              th:action="@{/voyageur/interurbain/{id}/reserver(id=${ligne.id})}"
              method="post" id="formResa">

            <!-- Arrêts -->
            <div class="card">
                <div class="card-title">Itinéraire</div>

                <label class="form-label">Arrêt de départ</label>
                <select class="form-select" id="arretDepart" name="arretDepartId" required>
                    <option value="">— Choisir —</option>
                    <option th:each="e : ${ligne.etapes}"
                            th:value="${e.id}"
                            th:attr="data-ordre=${e.ordre}"
                            th:text="${e.nomVille}"></option>
                </select>

                <label class="form-label">Arrêt d'arrivée</label>
                <select class="form-select" id="arretArrivee" name="arretArriveeId" required>
                    <option value="">— Choisir —</option>
                    <option th:each="e : ${ligne.etapes}"
                            th:value="${e.id}"
                            th:attr="data-ordre=${e.ordre}"
                            th:text="${e.nomVille}"></option>
                </select>

                <label class="form-label">Date du trajet</label>
                <input type="date" class="form-control" id="dateTrajet" name="dateTrajet"
                       required th:value="${aujourdhui}" th:attr="min=${aujourdhui}">
            </div>

            <!-- Horaires -->
            <div class="card">
                <div class="card-title">Horaire</div>
                <label class="horaire-card" th:each="h : ${ligne.horaires}">
                    <input type="radio" name="horaireId" th:value="${h.id}"
                           th:attr="data-prix=${h.prix}" required>
                    <div style="flex:1;">
                        <div class="h-time"
                             th:text="${h.heureDepart + ' → ' + h.heureArrivee}"></div>
                        <div class="h-jours" th:text="${h.jours}"></div>
                    </div>
                    <div class="h-prix" th:text="${h.prix + ' MRU'}"></div>
                </label>
            </div>

            <!-- Prix -->
            <div class="prix-box">
                <div>
                    <div class="prix-lbl">Montant à payer</div>
                    <div class="prix-note" id="prixNote" style="display:none;"></div>
                </div>
                <div class="prix-val" id="prixVal">—</div>
            </div>

            <button type="submit" class="btn-continuer" id="btnContinuer" disabled>
                Continuer vers le paiement →
            </button>
        </form>

    </div>
</div>

<script th:inline="javascript">
    const ligneId = /*[[${ligne.id}]]*/ 0;

    const depSel  = document.getElementById('arretDepart');
    const arrSel  = document.getElementById('arretArrivee');
    const dateInp = document.getElementById('dateTrajet');
    const prixVal = document.getElementById('prixVal');
    const prixNote= document.getElementById('prixNote');
    const btn     = document.getElementById('btnContinuer');
    const radios  = document.querySelectorAll('input[name="horaireId"]');

    let prixSegment = null; // prix de la matrice (si défini)

    function horaireChoisi() {
        return document.querySelector('input[name="horaireId"]:checked');
    }
    function prixHoraire() {
        const r = horaireChoisi();
        return r ? parseFloat(r.dataset.prix) : null;
    }

    function afficherPrix() {
        let prix = prixSegment != null ? prixSegment : prixHoraire();
        if (prix != null) {
            prixVal.textContent = prix.toLocaleString('fr-FR') + ' MRU';
        } else {
            prixVal.textContent = '—';
        }
    }

    function ordreSel(sel) {
        const opt = sel.selectedOptions[0];
        return opt && opt.dataset.ordre ? parseInt(opt.dataset.ordre) : null;
    }

    function valider() {
        prixNote.style.display = 'none';
        const dep = depSel.value, arr = arrSel.value;
        const dOrd = ordreSel(depSel), aOrd = ordreSel(arrSel);
        let ok = true;

        // arrêts valides
        if (dep && arr) {
            if (dep === arr || (dOrd != null && aOrd != null && dOrd >= aOrd)) {
                prixNote.textContent = "L'arrêt d'arrivée doit être après le départ";
                prixNote.style.display = 'block';
                prixSegment = null;
                afficherPrix();
                ok = false;
            }
        } else {
            ok = false;
        }

        if (!horaireChoisi() || !dateInp.value) ok = false;

        btn.disabled = !ok;
        return ok;
    }

    function chargerPrixSegment() {
        const dep = depSel.value, arr = arrSel.value;
        const dOrd = ordreSel(depSel), aOrd = ordreSel(arrSel);
        if (!dep || !arr || dep === arr ||
            (dOrd != null && aOrd != null && dOrd >= aOrd)) {
            prixSegment = null; afficherPrix(); return;
        }
        fetch(`/voyageur/interurbain/${ligneId}/prix`
              + `?arretDepartId=${dep}&arretArriveeId=${arr}`)
            .then(r => r.json())
            .then(d => { prixSegment = d.disponible ? d.prix : null; afficherPrix(); })
            .catch(() => { prixSegment = null; afficherPrix(); });
    }

    depSel.addEventListener('change', () => { valider(); chargerPrixSegment(); });
    arrSel.addEventListener('change', () => { valider(); chargerPrixSegment(); });
    dateInp.addEventListener('change', valider);
    radios.forEach(r => r.addEventListener('change', () => {
        document.querySelectorAll('.horaire-card')
                .forEach(c => c.classList.remove('actif'));
        r.closest('.horaire-card').classList.add('actif');
        afficherPrix();
        valider();
    }));
</script>
</body>
</html>
