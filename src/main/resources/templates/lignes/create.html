<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Create Ligne</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container mt-4">

    <h2>Nouvelle Ligne</h2>

    <form
            th:action="@{/lignes/create}"
            th:object="${ligne}"
            method="post">

        <div class="mb-3">

            <label>Numero</label>

            <input
                    type="text"
                    th:field="*{numero}"
                    class="form-control">

            <div
                    class="text-danger"
                    th:errors="*{numero}">
            </div>

        </div>

        <div class="mb-3">

            <label>Nom</label>

            <input
                    type="text"
                    th:field="*{nom}"
                    class="form-control">

            <div
                    class="text-danger"
                    th:errors="*{nom}">
            </div>

        </div>

        <div class="mb-3">

            <label>Description</label>

            <textarea
                    th:field="*{description}"
                    class="form-control">
            </textarea>

        </div>

        <button
                type="submit"
                class="btn btn-success">

            Enregistrer

        </button>

    </form>

</div>

</body>

</html>
