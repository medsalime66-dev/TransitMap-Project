<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Lignes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h2>Gestion des Lignes</h2>

    <form
            method="get"
            th:action="@{/lignes}"
            class="row mb-3">

        <div class="col-md-6">

            <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    placeholder="Recherche..."
                    th:value="${keyword}">
        </div>

        <div class="col-md-2">

            <button
                    type="submit"
                    class="btn btn-primary">

                Search

            </button>

        </div>

    </form>

    <a
            th:href="@{/lignes/create}"
            class="btn btn-success mb-3">

        Ajouter Ligne

    </a>

    <table class="table table-bordered">

        <thead>

        <tr>

            <th>ID</th>

            <th>Numero</th>

            <th>Nom</th>

            <th>Description</th>

            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="ligne : ${lignes.content}">

            <td th:text="${ligne.id}"></td>

            <td th:text="${ligne.numero}"></td>

            <td th:text="${ligne.nom}"></td>

            <td th:text="${ligne.description}"></td>

            <td>

                <a
                        th:href="@{/lignes/edit/{id}(id=${ligne.id})}"
                        class="btn btn-warning btn-sm">

                    Edit

                </a>

                <a
                        th:href="@{/lignes/delete/{id}(id=${ligne.id})}"
                        class="btn btn-danger btn-sm">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
