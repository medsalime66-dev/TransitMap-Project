<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<nav
        th:fragment="breadcrumbs"
        aria-label="breadcrumb">

    <ol class="breadcrumb">

        <li class="breadcrumb-item">
            <a th:href="@{/}">
                Home
            </a>
        </li>

        <li
                class="breadcrumb-item active"
                aria-current="page">

            Current Page

        </li>

    </ol>

</nav>

</body>

</html>
