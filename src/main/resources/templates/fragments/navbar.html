<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Carte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; }
        .layout { display: flex; flex-direction: column; height: 100vh; }

        /* Navbar public */
        .pub-nav {
            background: #0f1729;
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .pub-brand {
            color: white;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.3px;
        }
        .pub-nav-links { display: flex; align-items: center; gap: 8px; }
        .pub-nav-link {
            color: #8896b3;
            padding: 7px 14px;
            border-radius: 7px;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
        }
        .pub-nav-link:hover { color: white; background: rgba(255,255,255,0.08); }
        .btn-login {
            background: #185FA5;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn-login:hover { background: #0C447C; color: white; }
        .btn-dashboard {
            background: #1D9E75;
            color: white;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }

        /* Map */
        #map { flex: 1; z-index: 1; }

        /* Bottom panel */
        .bottom-panel {
            background: white;
            border-top: 1px solid #e0e0e0;
            padding: 14px 20px;
            flex-shrink: 0;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .login-prompt {
            font-size: 12px;
            color: #185FA5;
            text-decoration: none;
            font-weight: 500;
        }
        .ligne-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .ligne-chip {
            background: #E6F1FB;
            color: #0C447C;
            border: 1px solid #B5D4F4;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
        }
        .ligne-chip:hover { background: #185FA5; color: white; border-color: #185FA5; }
    </style>
</head>
<body>
<div class="layout">

    <!-- Navbar public -->
    <nav class="pub-nav">
        <a href="/map" class="pub-brand">🚌 TransitMap</a>
        <div class="pub-nav-links">
            <!-- غير مسجل -->
            <sec:authorize access="!isAuthenticated()">
                <span style="color:#8896b3;font-size:13px;">Explorez les lignes de transport</span>
                <a href="/login" class="btn-login" style="margin-left:12px;">Se connecter</a>
            </sec:authorize>

            <!-- مسجل كـ Voyageur -->
            <sec:authorize access="hasRole('VOYAGEUR')">
                <a href="/interurbain/search" class="pub-nav-link">🔍 Voyages interurbains</a>
                <a href="/map" class="pub-nav-link">🗺 Carte</a>
                <a href="/logout" style="background:#E24B4A;color:white;padding:7px 16px;border-radius:7px;font-size:13px;text-decoration:none;font-weight:500;">
                    Déconnexion
                </a>
            </sec:authorize>

            <!-- مسجل كـ Admin -->
            <sec:authorize access="hasRole('ADMIN')">
                <a href="/admin/dashboard" class="btn-dashboard">📊 Dashboard Admin</a>
                <a href="/logout" style="background:#E24B4A;color:white;padding:7px 16px;border-radius:7px;font-size:13px;text-decoration:none;font-weight:500;margin-left:8px;">
                    Déconnexion
                </a>
            </sec:authorize>

            <!-- مسجل كـ Agent -->
            <sec:authorize access="hasRole('AGENT')">
                <a href="/agent/dashboard" class="btn-dashboard">📋 Tableau de bord</a>
                <a href="/logout" style="background:#E24B4A;color:white;padding:7px 16px;border-radius:7px;font-size:13px;text-decoration:none;font-weight:500;margin-left:8px;">
                    Déconnexion
                </a>
            </sec:authorize>
        </div>
    </nav>

    <!-- Map -->
    <div id="map"></div>

    <!-- Bottom Panel -->
    <div class="bottom-panel">
        <div class="panel-header">
            <div class="panel-title">Lignes disponibles</div>
            <sec:authorize access="!isAuthenticated()">
                <a href="/login" class="login-prompt">Connectez-vous pour plus de détails →</a>
            </sec:authorize>
        </div>
        <div class="ligne-list" id="ligneList"></div>
    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script th:inline="javascript">
    const isAuthenticated = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;

    const map = L.map('map').setView([18.0735, -15.9582], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    fetch('/api/arrets')
        .then(r => r.json())
        .then(data => {
            data.forEach(a => {
                L.marker([a.latitude, a.longitude])
                    .addTo(map)
                    .bindPopup(`<b>${a.nom}</b>`);
            });
        });

    fetch('/api/vehicules')
        .then(r => r.json())
        .then(data => {
            data.forEach(v => {
                if (v.currentLatitude && v.currentLongitude) {
                    L.circleMarker([v.currentLatitude, v.currentLongitude], {
                        radius: 9, color: '#E24B4A',
                        fillColor: '#E24B4A', fillOpacity: 0.9
                    }).addTo(map).bindPopup(`<b>${v.matricule}</b>`);
                }
            });
        });

    fetch('/api/lignes')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('ligneList');
            data.forEach(l => {
                const chip = document.createElement('a');
                if (isAuthenticated) {
                    chip.href = `/voyageur/lignes/${l.id}/trajets`;
                } else {
                    chip.href = '/login';
                    chip.title = 'Connectez-vous pour voir les détails';
                }
                chip.className = 'ligne-chip';
                chip.textContent = `${l.numero} — ${l.nom}`;
                container.appendChild(chip);
            });
        });
</script>
</body>
</html>
