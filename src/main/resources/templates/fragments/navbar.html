<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark"
     style="background:#1a1a2e;">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" th:href="@{/}">
            🚌 TransitMap
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center gap-2">

                <!-- VOYAGEUR -->
                <li class="nav-item" sec:authorize="hasRole('VOYAGEUR')">
                    <a class="nav-link" th:href="@{/map}">🗺 Carte</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('VOYAGEUR')">
                    <a class="nav-link" th:href="@{/map}">🔍 Recherche</a>
                </li>

                <!-- AGENT -->
                <li class="nav-item" sec:authorize="hasRole('AGENT')">
                    <a class="nav-link" th:href="@{/agent/dashboard}">📋 Tableau de bord</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('AGENT')">
                    <a class="nav-link" th:href="@{/agent/demandes}">📨 Mes demandes</a>
                </li>

                <!-- ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">📊 Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/lignes}">Lignes</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/arrets}">Arrets</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/vehicules}">Véhicules</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/trajets}">Trajets</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/activite}">📡 Activité</a>
                </li>

                <!-- زر الخروج للجميع -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link"
                       style="background:#E24B4A;color:white;border-radius:6px;padding:5px 14px;"
                       th:href="@{/logout}">
                        Déconnexion
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>
</body>
</html>
