<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accès refusé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;}
        .error-card{background:white;border:1px solid #e0e0e0;border-radius:12px;padding:48px 40px;text-align:center;max-width:420px;}
        .error-code{font-size:72px;font-weight:700;color:#E24B4A;line-height:1;}
        .error-title{font-size:20px;font-weight:600;margin:16px 0 8px;}
        .error-msg{font-size:14px;color:#888;margin-bottom:28px;}
        .btn-home{background:#185FA5;color:white;padding:9px 24px;border-radius:8px;text-decoration:none;font-size:14px;}
        .btn-home:hover{background:#0C447C;color:white;}
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">403</div>
        <div class="error-title">Accès refusé</div>
        <div class="error-msg">
            Vous n'avez pas les permissions nécessaires pour accéder à cette page.
        </div>
        <a th:href="@{/}" class="btn-home">Retour à l'accueil</a>
    </div>
</body>
</html>
