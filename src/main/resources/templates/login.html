<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;display:flex;align-items:center;
             justify-content:center;min-height:100vh;}
        .login-card{width:380px;border-radius:12px;
                    border:1px solid #e0e0e0;padding:40px;
                    background:white;}
        .logo{text-align:center;margin-bottom:28px;}
        .logo .icon{width:52px;height:52px;background:#185FA5;
                    border-radius:10px;display:inline-flex;
                    align-items:center;justify-content:center;
                    margin-bottom:10px;}
        .logo h4{font-weight:600;margin:0;}
        .logo p{color:#888;font-size:13px;margin:0;}
        .btn-login{background:#185FA5;color:white;width:100%;
                   padding:10px;border:none;border-radius:8px;
                   font-size:15px;}
        .btn-login:hover{background:#0C447C;color:white;}
        .alert-error{background:#FCEBEB;color:#A32D2D;
                     border:1px solid #F09595;border-radius:8px;
                     padding:10px 14px;font-size:13px;
                     margin-bottom:16px;}
        .alert-logout{background:#EAF3DE;color:#3B6D11;
                      border:1px solid #97C459;border-radius:8px;
                      padding:10px 14px;font-size:13px;
                      margin-bottom:16px;}
        .divider{display:flex;align-items:center;gap:12px;
                 margin:20px 0;}
        .divider-line{flex:1;height:1px;background:#e0e0e0;}
        .divider-text{font-size:12px;color:#aaa;}
        .btn-register{display:block;text-align:center;
                      padding:10px;border:1px solid #185FA5;
                      border-radius:8px;color:#185FA5;
                      font-size:14px;font-weight:600;
                      text-decoration:none;
                      transition:background 0.15s;}
        .btn-register:hover{background:#E6F1FB;color:#185FA5;}
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo">
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="26" height="26" fill="white"
                 viewBox="0 0 24 24">
                <path d="M4 16V8a4 4 0 0 1 4-4h8a4 4 0 0 1
                         4 4v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
                <circle cx="8.5" cy="17.5" r="1.5"
                        fill="#185FA5"/>
                <circle cx="15.5" cy="17.5" r="1.5"
                        fill="#185FA5"/>
            </svg>
        </div>
        <h4>TransitMap</h4>
        <p>Portail de gestion des trajets</p>
    </div>

    <div class="alert-error" th:if="${param.error}">
        Nom d'utilisateur ou mot de passe incorrect.
    </div>
    <div class="alert-logout" th:if="${param.logout}">
        Vous avez été déconnecté avec succès.
    </div>
    <div class="alert-error"
         th:if="${param.deconnexion}">
        Vous avez été déconnecté avec succès.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label"
                   style="font-size:13px;color:#555;">
                Nom d'utilisateur
            </label>
            <input type="text" name="username"
                   class="form-control"
                   placeholder="username"
                   required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label"
                   style="font-size:13px;color:#555;">
                Mot de passe
            </label>
            <input type="password" name="password"
                   class="form-control"
                   placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">
            Se connecter
        </button>
    </form>

    <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">ou</span>
        <div class="divider-line"></div>
    </div>

    <a href="/inscription/choix" class="btn-register">
        Créer un compte →
    </a>
</div>
</body>
</html>
