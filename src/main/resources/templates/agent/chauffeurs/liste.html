<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mes chauffeurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <div style="display:flex;align-items:center;
                        justify-content:space-between;margin-bottom:24px;">
                <div class="page-title" style="margin:0;">Mes chauffeurs</div>
                <a th:href="@{/agent/chauffeurs/creer}"
                   class="btn-add">+ Ajouter un chauffeur</a>
            </div>

            <div class="card">
                <div class="empty"
                     th:if="${#lists.isEmpty(chauffeurs)}">
                    Aucun chauffeur enregistré.
                    <a th:href="@{/agent/chauffeurs/creer}"
                       style="color:#185FA5;">Ajouter le premier →</a>
                </div>

                <table class="tbl"
                       th:if="${!#lists.isEmpty(chauffeurs)}">
                    <thead>
                        <tr>
                            <th>Chauffeur</th>
                            <th>Permis</th>
                            <th>Téléphone</th>
                            <th>Ligne assignée</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${chauffeurs}">
                            <td>
                                <div style="font-weight:500;"
                                     th:text="${c.nomComplet}"></div>
                                <div style="font-size:12px;color:#888;"
                                     th:text="${c.email}"></div>
                            </td>
                            <td style="font-family:monospace;font-size:13px;"
                                th:text="${c.numeroPermis}"></td>
                            <td th:text="${c.telephone}"></td>
                            <td>
                                <span th:if="${c.ligneNom != null}"
                                      style="background:#EAF3DE;color:#3B6D11;
                                             padding:2px 8px;border-radius:6px;
                                             font-size:12px;"
                                      th:text="${c.ligneNom}"></span>
                                <span th:unless="${c.ligneNom != null}"
                                      style="color:#aaa;font-size:12px;">
                                    Non assigné
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/agent/chauffeurs/modifier/
                                    {id}(id=${c.id})}"
                                   class="btn-sm btn-detail"
                                   style="margin-right:4px;">Modifier</a>
                                <a th:href="@{/agent/chauffeurs/supprimer/
                                    {id}(id=${c.id})}"
                                   class="btn-sm btn-del"
                                   onclick="return confirm(
                                       'Supprimer ce chauffeur ?')">
                                    Supprimer
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
