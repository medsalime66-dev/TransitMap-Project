<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier un chauffeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:28px;overflow:auto;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:24px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px;}
        .readonly-note{font-size:12px;color:#aaa;margin-top:4px;}
        .sidebar-link:hover{background:rgba(255,255,255,0.08);color:white;}
        .sidebar-section-label{font-size:11px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:0 0 8px 10px;white-space:nowrap;}
        .sidebar-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0;}
        #sidebar.collapsed{width:60px;}
        #sidebar.collapsed .sidebar-text,#sidebar.collapsed .sidebar-section-label{opacity:0;pointer-events:none;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <a href="/agent/chauffeurs" class="back">← Retour aux chauffeurs</a>
            <div class="page-title">Modifier le chauffeur</div>

            <div class="card form-card">
                <form th:action="@{/agent/chauffeurs/modifier/{id}(id=${chauffeur.id})}"
                      th:object="${chauffeur}" method="post">

                    <span class="section-label">Informations modifiables</span>

                    <div class="mb-3">
                        <label class="form-label">Nom complet *</label>
                        <input type="text" th:field="*{nomComplet}" class="form-control">
                        <div class="text-danger" th:errors="*{nomComplet}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Téléphone *</label>
                        <input type="tel" th:field="*{telephone}" class="form-control">
                        <div class="text-danger" th:errors="*{telephone}"></div>
                    </div>

                    <span class="section-label">Informations non modifiables</span>

                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label">N° de permis</label>
                            <input type="text" th:field="*{numeroPermis}"
                                   class="form-control" readonly
                                   style="background:#f5f5f5;">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Email (identifiant)</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control" readonly
                                   style="background:#f5f5f5;">
                            <div class="readonly-note">
                                Le permis et l'email ne sont pas modifiables.
                            </div>
                        </div>
                    </div>

                    <!-- Le mot de passe n'est PAS modifié par cette action ;
                         valeur technique pour satisfaire la validation. -->
                    <input type="hidden" name="motDePasse" value="000000">

                    <button type="submit" class="btn-submit">
                        Enregistrer les modifications
                    </button>
                    <a href="/agent/chauffeurs" class="btn-cancel">Annuler</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
