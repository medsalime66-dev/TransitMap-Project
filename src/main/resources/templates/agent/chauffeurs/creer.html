<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un chauffeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:28px;overflow:auto;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:24px;}
        .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
        .stat{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:18px;text-align:center;}
        .stat .n{font-size:30px;font-weight:700;margin-bottom:4px;}
        .stat .l{font-size:12px;color:#888;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px;}
        .card-title{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:16px;}
        .activity-item{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid #f5f5f5;}
        .activity-item:last-child{border-bottom:none;}
        .activity-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
        .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;}
        .b-active{background:#EAF3DE;color:#3B6D11;}
        .b-cours{background:#E6F1FB;color:#185FA5;}
        .b-plan{background:#F1EFE8;color:#5F5E5A;}
        .b-wait{background:#FAEEDA;color:#633806;}
        .b-appr{background:#EAF3DE;color:#3B6D11;}
        .b-rej{background:#FCEBEB;color:#A32D2D;}
        .empty{text-align:center;padding:24px;color:#aaa;font-size:13px;}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#a0aec0;font-size:14px;font-weight:500;text-decoration:none;margin-bottom:3px;white-space:nowrap;}
        .sidebar-link:hover{background:rgba(255,255,255,0.08);color:white;}
        .sidebar-section-label{font-size:11px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:0 0 8px 10px;white-space:nowrap;}
        .sidebar-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0;}
        #sidebar.collapsed{width:60px;}
        #sidebar.collapsed .sidebar-text,#sidebar.collapsed .sidebar-section-label{opacity:0;pointer-events:none;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <a href="/agent/chauffeurs" class="back">
                ← Retour aux chauffeurs
            </a>
            <div class="page-title">Ajouter un chauffeur</div>

            <div class="card form-card">
                <form th:action="@{/agent/chauffeurs/creer}"
                      th:object="${chauffeur}" method="post">

                    <span class="section-label">Informations personnelles</span>

                    <div class="mb-3">
                        <label class="form-label">Nom complet *</label>
                        <input type="text" th:field="*{nomComplet}"
                               class="form-control"
                               placeholder="Mohamed Salem Ould...">
                        <div class="text-danger"
                             th:errors="*{nomComplet}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Téléphone *</label>
                            <input type="tel" th:field="*{telephone}"
                                   class="form-control"
                                   placeholder="20000000">
                            <div class="text-danger"
                                 th:errors="*{telephone}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">N° de permis *</label>
                            <input type="text" th:field="*{numeroPermis}"
                                   class="form-control"
                                   placeholder="MR-2024-XXXX">
                            <div class="text-danger"
                                 th:errors="*{numeroPermis}"></div>
                        </div>
                    </div>

                    <span class="section-label">Compte de connexion</span>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Email (identifiant) *</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control"
                                   placeholder="chauffeur@email.com">
                            <div class="text-danger"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Mot de passe *</label>
                            <input type="password" th:field="*{motDePasse}"
                                   class="form-control"
                                   placeholder="Min. 6 caractères">
                            <div class="text-danger"
                                 th:errors="*{motDePasse}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        Créer le compte chauffeur
                    </button>
                    <a href="/agent/chauffeurs" class="btn-cancel">
                        Annuler
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
