<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un chauffeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        .form-card{max-width:560px;}
        .form-control,.form-select{font-size:13px;border-radius:8px;
                                   border:1px solid #e0e0e0;padding:9px 12px;}
        .section-label{font-size:12px;font-weight:700;color:#185FA5;
                       text-transform:uppercase;letter-spacing:1px;
                       margin:16px 0 10px;display:block;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <a href="/agent/chauffeurs" class="back">
                ← Retour aux chauffeurs
            </a>
            <div class="page-title">Ajouter un chauffeur</div>

            <div class="card form-card">
                <form th:action="@{/agent/chauffeurs/creer}"
                      th:object="${chauffeur}" method="post">

                    <span class="section-label">Informations personnelles</span>

                    <div class="mb-3">
                        <label class="form-label">Nom complet *</label>
                        <input type="text" th:field="*{nomComplet}"
                               class="form-control"
                               placeholder="Mohamed Salem Ould...">
                        <div class="text-danger"
                             th:errors="*{nomComplet}"></div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Téléphone *</label>
                            <input type="tel" th:field="*{telephone}"
                                   class="form-control"
                                   placeholder="20000000">
                            <div class="text-danger"
                                 th:errors="*{telephone}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">N° de permis *</label>
                            <input type="text" th:field="*{numeroPermis}"
                                   class="form-control"
                                   placeholder="MR-2024-XXXX">
                            <div class="text-danger"
                                 th:errors="*{numeroPermis}"></div>
                        </div>
                    </div>

                    <span class="section-label">Compte de connexion</span>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Email (identifiant) *</label>
                            <input type="email" th:field="*{email}"
                                   class="form-control"
                                   placeholder="chauffeur@email.com">
                            <div class="text-danger"
                                 th:errors="*{email}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Mot de passe *</label>
                            <input type="password" th:field="*{motDePasse}"
                                   class="form-control"
                                   placeholder="Min. 6 caractères">
                            <div class="text-danger"
                                 th:errors="*{motDePasse}"></div>
                        </div>
                    </div>

                    <span class="section-label">Assignation (optionnel)</span>

                    <div class="mb-4">
                        <label class="form-label">Ligne assignée</label>
                        <select th:field="*{ligneId}" class="form-select">
                            <option value="">-- Aucune ligne --</option>
                            <option th:each="l : ${lignes}"
                                    th:value="${l.id}"
                                    th:text="${l.numero + ' — ' + l.nom}">
                            </option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">
                        Créer le compte chauffeur
                    </button>
                    <a href="/agent/chauffeurs" class="btn-cancel">
                        Annuler
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
