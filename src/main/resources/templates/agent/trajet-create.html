<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un trajet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;}
        .form-card{background:white;border:1px solid #e0e0e0;border-radius:10px;padding:28px;max-width:520px;margin:40px auto;}
        .form-card h5{font-weight:600;margin-bottom:20px;}
        .btn-submit{background:#185FA5;color:white;border:none;padding:9px 24px;border-radius:8px;font-size:14px;}
        .text-danger{font-size:12px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="form-card">
        <h5>Ajouter un trajet</h5>
        <form th:action="@{/agent/trajets/create}" th:object="${trajet}" method="post">
            <div class="mb-3">
                <label class="form-label" style="font-size:13px;">Date</label>
                <input type="date" th:field="*{dateTrajet}" class="form-control">
                <div class="text-danger" th:errors="*{dateTrajet}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-size:13px;">Heure départ</label>
                <input type="time" th:field="*{heureDepart}" class="form-control">
                <div class="text-danger" th:errors="*{heureDepart}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-size:13px;">Heure arrivée</label>
                <input type="time" th:field="*{heureArrivee}" class="form-control">
                <div class="text-danger" th:errors="*{heureArrivee}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-size:13px;">Statut</label>
                <select th:field="*{statut}" class="form-select">
                    <option value="PLANIFIE">Planifié</option>
                    <option value="EN_COURS">En cours</option>
                    <option value="ACTIVE">Actif</option>
                    <option value="TERMINE">Terminé</option>
                </select>
                <div class="text-danger" th:errors="*{statut}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label" style="font-size:13px;">Ligne</label>
                <select th:field="*{ligneId}" class="form-select">
                    <option th:each="l : ${lignes}" th:value="${l.id}" th:text="${l.numero + ' — ' + l.nom}"></option>
                </select>
                <div class="text-danger" th:errors="*{ligneId}"></div>
            </div>
            <button type="submit" class="btn-submit">Enregistrer</button>
            <a th:href="@{/agent/dashboard}" style="margin-left:12px;font-size:13px;color:#888;">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
