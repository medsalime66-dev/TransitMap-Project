<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle demande</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;}
        .form-card{background:white;border:1px solid #e0e0e0;border-radius:10px;padding:28px;max-width:520px;margin:40px auto;}
        .form-card h5{font-weight:600;margin-bottom:20px;}
        .btn-submit{background:#185FA5;color:white;border:none;padding:9px 24px;border-radius:8px;font-size:14px;}
        .btn-submit:hover{background:#0C447C;}
        .text-danger{font-size:12px;}
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="form-card">
        <h5>Nouvelle demande de ligne</h5>
        <form th:action="@{/agent/demandes/create}" th:object="${demande}" method="post">
            <div class="mb-3">
                <label class="form-label" style="font-size:13px;">Nom de la ligne</label>
                <input type="text" th:field="*{nomLigne}" class="form-control">
                <div class="text-danger" th:errors="*{nomLigne}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" style="font-size:13px;">Numéro</label>
                <input type="text" th:field="*{numeroLigne}" class="form-control" placeholder="ex: L05">
                <div class="text-danger" th:errors="*{numeroLigne}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label" style="font-size:13px;">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn-submit">Envoyer la demande</button>
            <a th:href="@{/agent/dashboard}"
               style="margin-left:12px;font-size:13px;color:#888;">Annuler</a>
        </form>
    </div>
</div>
</body>
</html>
