<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${ligne.nom} + ' — Détail'">Détail ligne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .main{display:flex;flex:1;}
        .content{flex:1;padding:28px;overflow:auto;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
        .page-sub{font-size:13px;color:#888;margin-bottom:24px;}
        .card{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:18px;}
        .card-title{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:14px;}
        #map{height:400px;border-radius:10px;border:1px solid #e0e0e0;}
        .tbl{width:100%;border-collapse:collapse;font-size:13px;}
        .tbl th{text-align:left;padding:10px 14px;color:#888;font-weight:500;
                font-size:12px;border-bottom:1px solid #f0f0f0;}
        .tbl td{padding:11px 14px;border-bottom:1px solid #f9f9f9;color:#333;}
        .tbl tr:last-child td{border-bottom:none;}
        /* Matrice */
        .matrix-wrap{overflow-x:auto;}
        .matrix{border-collapse:collapse;font-size:12px;}
        .matrix th{background:#f8f9fa;padding:8px 14px;border:1px solid #e5e7eb;
                   font-weight:600;color:#1a1a2e;white-space:nowrap;}
        .matrix td{padding:8px 14px;border:1px solid #e5e7eb;text-align:center;color:#333;}
        .matrix td.diag{background:#f5f5f5;color:#aaa;font-weight:600;}
        .matrix td.price{color:#185FA5;font-weight:600;}
        .route-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
        .city{background:#1a1a2e;color:white;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;}
        .arrow{font-size:18px;color:#aaa;}
        .btn-add{background:#1D9E75;color:white;border:none;padding:8px 18px;
                 border-radius:8px;font-size:13px;text-decoration:none;display:inline-block;}
        .btn-back{background:#f0f4f8;color:#555;border:none;padding:8px 16px;
                  border-radius:8px;font-size:13px;text-decoration:none;display:inline-block;margin-right:8px;}
        .order-badge{background:#185FA5;color:white;width:22px;height:22px;border-radius:50%;
                     display:inline-flex;align-items:center;justify-content:center;
                     font-size:11px;font-weight:700;flex-shrink:0;}
        .sidebar-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:#a0aec0;font-size:14px;font-weight:500;text-decoration:none;margin-bottom:3px;white-space:nowrap;}
        .sidebar-link:hover{background:rgba(255,255,255,0.08);color:white;}
        .sidebar-section-label{font-size:11px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin:0 0 8px 10px;white-space:nowrap;}
        .sidebar-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
        .sidebar-divider{height:1px;background:rgba(255,255,255,0.06);margin:14px 0;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <!-- En-tête -->
            <div style="display:flex;align-items:flex-start;
                        justify-content:space-between;margin-bottom:20px;">
                <div>
                    <div class="page-title" th:text="${ligne.nom}">Nom</div>
                    <div class="route-header" style="margin-top:6px;">
                        <span class="city" th:text="${ligne.villeDepart}"></span>
                        <span class="arrow">→</span>
                        <span class="city" th:text="${ligne.villeArrivee}"></span>
                    </div>
                </div>
                <div>
                    <a th:href="@{/agent/interurbain}" class="btn-back">← Mes lignes</a>
                    <a th:href="@{/agent/interurbain/{id}/arret/ajouter(id=${ligne.id})}"
                       class="btn-add">+ Ajouter un arrêt</a>
                </div>
            </div>

            <!-- Carte -->
            <div class="card">
                <div class="card-title">Tracé de la ligne</div>
                <div id="map"></div>
            </div>

            <!-- Tableau arrêts -->
            <div class="card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
                    <div class="card-title" style="margin:0;">Arrêts (
                        <span th:text="${ligne.etapes != null ? ligne.etapes.size() : 0}">0</span>)
                    </div>
                    <a th:href="@{/agent/interurbain/{id}/arret/ajouter(id=${ligne.id})}"
                       class="btn-add" style="font-size:12px;padding:6px 14px;">+ Arrêt</a>
                </div>
                <div th:if="${ligne.etapes == null or #lists.isEmpty(ligne.etapes)}"
                     style="text-align:center;padding:24px;color:#aaa;font-size:13px;">
                    Aucun arrêt.
                </div>
                <table class="tbl" th:if="${ligne.etapes != null and !#lists.isEmpty(ligne.etapes)}">
                    <thead>
                        <tr>
                            <th>Ordre</th>
                            <th>Nom de la ville</th>
                            <th>Latitude</th>
                            <th>Longitude</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${ligne.etapes}">
                            <td>
                                <span class="order-badge" th:text="${e.ordre}"></span>
                            </td>
                            <td style="font-weight:500;" th:text="${e.nomVille}"></td>
                            <td style="font-family:monospace;font-size:12px;"
                                th:text="${#numbers.formatDecimal(e.latitude, 1, 5)}"></td>
                            <td style="font-family:monospace;font-size:12px;"
                                th:text="${#numbers.formatDecimal(e.longitude, 1, 5)}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Matrice de prix -->
            <div class="card"
                 th:if="${ligne.etapes != null and ligne.etapes.size() > 1 and matrice != null}">
                <div class="card-title">Matrice de prix (MRU)</div>
                <div class="matrix-wrap">
                    <table class="matrix">
                        <thead>
                            <tr>
                                <th></th>
                                <th th:each="col : ${ligne.etapes}"
                                    th:text="${col.nomVille}"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rowData, rowStat : ${matrice}">
                                <th th:text="${ligne.etapes[rowStat.index].nomVille}"></th>
                                <td th:each="cell, colStat : ${rowData}"
                                    th:text="${cell}"
                                    th:classappend="${cell == '—'} ? 'diag' : 'price'"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    let etapes = [];
    try {
        etapes = JSON.parse(/*[[${etapesJson}]]*/ '[]');
    } catch (err) {
        console.error('Erreur parsing etapesJson:', err);
        etapes = [];
    }

    // Trier par ordre pour tracer correctement la polyline
    etapes.sort((a, b) => a.ordre - b.ordre);

    const map = L.map('map').setView([18.0735, -15.9582], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    if (etapes.length > 0) {
        const coords = etapes.map(e => [e.lat, e.lng]);

        etapes.forEach(function(e, i) {
            const isFirst = i === 0;
            const isLast  = i === etapes.length - 1;
            const color   = isFirst ? '#185FA5' : isLast ? '#1D9E75' : '#BA7517';
            const marker  = L.divIcon({
                html: `<div style="background:${color};color:white;width:26px;height:26px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${e.ordre}</div>`,
                className: '', iconAnchor: [13, 13]
            });
            L.marker([e.lat, e.lng], {icon: marker})
             .bindTooltip(e.nom, {permanent: true, direction: 'top', offset: [0, -14]})
             .addTo(map);
        });

        if (coords.length > 1) {
            L.polyline(coords, {color: '#185FA5', weight: 3}).addTo(map);
        }

        const bounds = L.latLngBounds(coords);
        map.fitBounds(bounds, {padding: [40, 40]});
    }
</script>
</body>
</html>
