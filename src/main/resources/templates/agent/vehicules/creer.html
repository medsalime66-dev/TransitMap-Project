<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un véhicule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/admin.css" rel="stylesheet">
    <style>
        .form-card{max-width:560px;}
        .form-control,.form-select{font-size:13px;border-radius:8px;
                                   border:1px solid #e0e0e0;padding:9px 12px;}
        .section-label{font-size:12px;font-weight:700;color:#185FA5;
                       text-transform:uppercase;letter-spacing:1px;
                       margin:16px 0 10px;display:block;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="main">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        <div class="content">

            <a href="/agent/vehicules" class="back">
                ← Retour aux véhicules
            </a>
            <div class="page-title">Ajouter un véhicule</div>

            <div class="card form-card">
                <form th:action="@{/agent/vehicules/creer}"
                      th:object="${vehicule}" method="post">

                    <span class="section-label">Informations véhicule</span>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Matricule *</label>
                            <input type="text" th:field="*{matricule}"
                                   class="form-control"
                                   placeholder="NKT-0001-A">
                            <div class="text-danger"
                                 th:errors="*{matricule}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Marque / Modèle</label>
                            <input type="text" th:field="*{marque}"
                                   class="form-control"
                                   placeholder="Toyota Coaster">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-4">
                            <label class="form-label">Capacité *</label>
                            <input type="number" th:field="*{capacite}"
                                   class="form-control"
                                   placeholder="30" min="1">
                            <div class="text-danger"
                                 th:errors="*{capacite}"></div>
                        </div>
                        <div class="col-4">
                            <label class="form-label">Année</label>
                            <input type="number" th:field="*{annee}"
                                   class="form-control"
                                   placeholder="2020">
                        </div>
                        <div class="col-4">
                            <label class="form-label">Statut *</label>
                            <select th:field="*{statut}" class="form-select">
                                <option value="EN_SERVICE">En service</option>
                                <option value="EN_MAINTENANCE">
                                    En maintenance
                                </option>
                                <option value="HORS_SERVICE">
                                    Hors service
                                </option>
                            </select>
                        </div>
                    </div>

                    <span class="section-label">Assignation</span>

                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label">Ligne *</label>
                            <select th:field="*{ligneId}" class="form-select">
                                <option value="">-- Choisir une ligne --</option>
                                <option th:each="l : ${lignes}"
                                        th:value="${l.id}"
                                        th:text="${l.numero + ' — ' + l.nom}">
                                </option>
                            </select>
                            <div class="text-danger"
                                 th:errors="*{ligneId}"></div>
                        </div>
                        <div class="col-6">
                            <label class="form-label">
                                Chauffeur (optionnel)
                            </label>
                            <select th:field="*{chauffeurId}"
                                    class="form-select">
                                <option value="">-- Aucun chauffeur --</option>
                                <option th:each="c : ${chauffeurs}"
                                        th:value="${c.id}"
                                        th:text="${c.nomComplet}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        Enregistrer le véhicule
                    </button>
                    <a href="/agent/vehicules" class="btn-cancel">
                        Annuler
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
