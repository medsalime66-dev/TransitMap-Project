<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rechercher un voyage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .layout{display:flex;flex-direction:column;min-height:100vh;}
        .content{flex:1;padding:28px;max-width:640px;margin:0 auto;width:100%;}
        .page-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
        .page-sub{font-size:13px;color:#888;margin-bottom:22px;}

        .search-card{background:white;border:1px solid #e5e7eb;border-radius:12px;
                     padding:18px 20px;margin-bottom:24px;}
        .row-fields{display:flex;gap:12px;flex-wrap:wrap;}
        .field{flex:1;min-width:180px;}
        .form-label{font-size:12px;color:#888;margin-bottom:5px;display:block;
                    text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
        .form-select{width:100%;padding:10px 14px;border:1px solid #e0e0e0;
                     border-radius:8px;font-size:14px;background:white;}
        .form-select:focus{border-color:#185FA5;
                           box-shadow:0 0 0 3px rgba(24,95,165,0.1);outline:none;}
        .btn-search{width:100%;background:#185FA5;color:white;border:none;
                    padding:12px;border-radius:9px;font-size:15px;font-weight:600;
                    cursor:pointer;margin-top:14px;}
        .btn-search:hover{background:#0C447C;}

        .section-titre{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;
                       letter-spacing:1px;margin-bottom:14px;}

        .result-card{background:white;border:1px solid #e5e7eb;border-radius:12px;
                     padding:16px 20px;margin-bottom:12px;}
        .result-head{display:flex;align-items:flex-start;justify-content:space-between;
                     gap:12px;margin-bottom:12px;}
        .r-nom{font-size:15px;font-weight:600;color:#1a1a2e;}
        .r-trajet{font-size:13px;color:#888;margin-top:3px;}
        .btn-reserver{background:#185FA5;color:white;padding:8px 18px;border-radius:8px;
                      font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap;}
        .btn-reserver:hover{background:#0C447C;color:white;}

        .horaires{display:flex;flex-direction:column;gap:8px;}
        .horaire-pill{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
                      background:#f7f9fc;border:1px solid #eef1f6;border-radius:8px;
                      padding:8px 14px;font-size:13px;color:#444;}
        .horaire-pill .heure{font-weight:600;color:#1a1a2e;}
        .pill-jours{color:#888;font-size:12px;}
        .pill-prix{margin-left:auto;font-weight:700;color:#1D9E75;}
        .no-horaire{font-size:13px;color:#aaa;font-style:italic;}

        .vide{background:white;border:1px solid #e5e7eb;border-radius:12px;
              text-align:center;padding:48px 24px;color:#aaa;}
        .vide-icon{font-size:42px;margin-bottom:12px;}
        .vide-titre{font-size:16px;font-weight:600;color:#555;margin-bottom:6px;}
        .vide-txt{font-size:13px;}
    </style>
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="content">

        <div class="page-title">Rechercher un voyage</div>
        <div class="page-sub">Trouvez une ligne interurbaine entre deux villes</div>

        <!-- Formulaire de recherche -->
        <form th:action="@{/interurbain/search}" method="get" class="search-card">
            <div class="row-fields">
                <div class="field">
                    <label class="form-label">Départ</label>
                    <select class="form-select" name="villeDepart" required>
                        <option value="">— Ville de départ —</option>
                        <option th:each="v : ${villes}" th:value="${v}" th:text="${v}"
                                th:selected="${v == villeDepart}"></option>
                    </select>
                </div>
                <div class="field">
                    <label class="form-label">Arrivée</label>
                    <select class="form-select" name="villeArrivee" required>
                        <option value="">— Ville d'arrivée —</option>
                        <option th:each="v : ${villes}" th:value="${v}" th:text="${v}"
                                th:selected="${v == villeArrivee}"></option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn-search">🔍 Rechercher</button>
        </form>

        <!-- Résultats -->
        <th:block th:if="${resultats != null}">

            <!-- Aucun résultat -->
            <div class="vide" th:if="${#lists.isEmpty(resultats)}">
                <div class="vide-icon">🚌</div>
                <div class="vide-titre">Aucun trajet trouvé</div>
                <div class="vide-txt">
                    Pas de ligne directe entre
                    <strong th:text="${villeDepart}"></strong> et
                    <strong th:text="${villeArrivee}"></strong>.
                </div>
            </div>

            <!-- Liste des résultats -->
            <th:block th:unless="${#lists.isEmpty(resultats)}">
                <div class="section-titre"
                     th:text="${#lists.size(resultats) + ' trajet(s) trouvé(s)'}"></div>

                <div class="result-card" th:each="l : ${resultats}">
                    <div class="result-head">
                        <div>
                            <div class="r-nom" th:text="${l.nom}"></div>
                            <div class="r-trajet"
                                 th:text="${l.villeDepart + ' → ' + l.villeArrivee}"></div>
                        </div>
                        <a th:href="@{/voyageur/interurbain/{id}/reserver(id=${l.id})}"
                           class="btn-reserver">Réserver →</a>
                    </div>

                    <div class="horaires" th:unless="${#lists.isEmpty(l.horaires)}">
                        <div class="horaire-pill" th:each="h : ${l.horaires}">
                            <span class="heure"
                                  th:text="${h.heureDepart + ' → ' + h.heureArrivee}"></span>
                            <span class="pill-jours" th:text="${h.jours}"></span>
                            <span class="pill-prix" th:text="${h.prix + ' MRU'}"></span>
                        </div>
                    </div>
                    <div class="no-horaire" th:if="${#lists.isEmpty(l.horaires)}">
                        Aucun horaire disponible
                    </div>
                </div>
            </th:block>
        </th:block>

        <!-- État initial (avant recherche) -->
        <div class="vide" th:if="${resultats == null}">
            <div class="vide-icon">🔍</div>
            <div class="vide-titre">Choisissez votre trajet</div>
            <div class="vide-txt">
                Sélectionnez une ville de départ et d'arrivée pour voir les lignes disponibles.
            </div>
        </div>

    </div>
</div>
</body>
</html>
