<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Demande d'inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;background:#f5f7fa;}
        .page-wrap{max-width:700px;margin:40px auto;padding:0 16px;}
        .header{text-align:center;margin-bottom:32px;}
        .header .logo{font-size:28px;font-weight:700;color:#0f1729;}
        .header .sous-titre{font-size:14px;color:#888;margin-top:4px;}
        .card-form{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px;}
        .section-titre{font-size:13px;font-weight:700;color:#185FA5;text-transform:uppercase;
                       letter-spacing:1px;margin:20px 0 12px;padding-bottom:6px;
                       border-bottom:2px solid #E6F1FB;}
        .form-label{font-size:13px;color:#555;margin-bottom:4px;}
        .form-control,.form-select{font-size:13px;border-radius:8px;
                                   border:1px solid #e0e0e0;padding:9px 12px;}
        .form-control:focus,.form-select:focus{border-color:#185FA5;
                                               box-shadow:0 0 0 3px rgba(24,95,165,0.1);}
        .text-danger{font-size:12px;}
        .code-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
        .code-item{background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;
                   padding:12px;}
        .code-item label{font-size:12px;font-weight:600;color:#555;margin-bottom:6px;
                         display:flex;align-items:center;gap:6px;}
        .code-item .badge-obligatoire{background:#FCEBEB;color:#A32D2D;
                                       padding:1px 6px;border-radius:4px;font-size:10px;}
        .btn-soumettre{width:100%;background:#185FA5;color:white;border:none;
                       padding:12px;border-radius:9px;font-size:15px;
                       font-weight:600;cursor:pointer;margin-top:20px;}
        .btn-soumettre:hover{background:#0C447C;}
        .lien-connexion{text-align:center;margin-top:16px;font-size:13px;color:#888;}
        .alerte{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
        .alerte-erreur{background:#FCEBEB;color:#A32D2D;border:1px solid #F09595;}
        .obligatoire-note{font-size:11px;color:#888;margin-bottom:12px;}
    </style>
</head>
<body>
<div class="page-wrap">

    <div class="header">
        <div class="logo">🚌 TransitMap</div>
        <div class="sous-titre">Demande d'inscription — Agent de transport</div>
    </div>

    <div class="card-form">

        <!-- Erreurs globales -->
        <div class="alerte alerte-erreur"
             th:if="${erreurPaiement}"
             th:text="${erreurPaiement}"></div>
        <div class="alerte alerte-erreur"
             th:if="${erreurEmail}"
             th:text="${erreurEmail}"></div>

        <form th:action="@{/inscription}" th:object="${demande}" method="post">

            <!-- Informations personnelles -->
            <div class="section-titre">Informations personnelles</div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Nom complet *</label>
                    <input type="text" th:field="*{nomComplet}"
                           class="form-control" placeholder="Mohamed Salem...">
                    <div class="text-danger" th:errors="*{nomComplet}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email *</label>
                    <input type="email" th:field="*{email}"
                           class="form-control" placeholder="email@exemple.com">
                    <div class="text-danger" th:errors="*{email}"></div>
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Téléphone *</label>
                    <input type="tel" th:field="*{telephone}"
                           class="form-control" placeholder="20000000">
                    <div class="text-danger" th:errors="*{telephone}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Numéro CIN</label>
                    <input type="text" th:field="*{numeroCIN}"
                           class="form-control" placeholder="Optionnel">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Mot de passe *</label>
                    <input type="password" th:field="*{motDePasse}"
                           class="form-control" placeholder="Min. 6 caractères">
                    <div class="text-danger" th:errors="*{motDePasse}"></div>
                </div>
            </div>

            <!-- Informations entreprise -->
            <div class="section-titre">Informations de l'entreprise</div>

            <div class="row g-3 mb-3">
                <div class="col-md-8">
                    <label class="form-label">Nom de l'entreprise *</label>
                    <input type="text" th:field="*{nomEntreprise}"
                           class="form-control" placeholder="Société de transport...">
                    <div class="text-danger" th:errors="*{nomEntreprise}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">N° commercial</label>
                    <input type="text" th:field="*{numeroCommercial}"
                           class="form-control" placeholder="Optionnel">
                </div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label">Adresse du siège</label>
                    <input type="text" th:field="*{adresse}"
                           class="form-control" placeholder="Nouakchott, Mauritanie">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Type de service *</label>
                    <select th:field="*{typeService}" class="form-select">
                        <option value="">-- Choisir --</option>
                        <option value="URBAIN">Urbain (dans la ville)</option>
                        <option value="INTERURBAIN">Interurbain (entre villes)</option>
                        <option value="LES_DEUX">Les deux</option>
                    </select>
                    <div class="text-danger" th:errors="*{typeService}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Description de la demande</label>
                <textarea th:field="*{description}" class="form-control"
                          rows="2"
                          placeholder="Décrivez votre activité..."></textarea>
            </div>

            <!-- Codes de paiement -->
            <div class="section-titre">Codes de paiement</div>
            <div class="obligatoire-note">
                * Au moins un code de portefeuille électronique est obligatoire.
            </div>

            <div class="code-grid">

                <div class="code-item">
                    <label>
                        🏦 Bankily
                        <span class="badge-obligatoire">Code commerçant</span>
                    </label>
                    <input type="text" th:field="*{codeBankily}"
                           class="form-control" placeholder="Ex: 013274">
                </div>

                <div class="code-item">
                    <label>🏦 Masrvi</label>
                    <input type="text" th:field="*{codeMasrvi}"
                           class="form-control" placeholder="Code commerçant">
                </div>

                <div class="code-item">
                    <label>🏦 Sedad</label>
                    <input type="text" th:field="*{codeSedad}"
                           class="form-control" placeholder="Code commerçant">
                </div>

                <div class="code-item">
                    <label>🏦 Click</label>
                    <input type="text" th:field="*{codeClick}"
                           class="form-control" placeholder="Code commerçant">
                </div>

                <div class="code-item">
                    <label>🏦 BAMIS Digital</label>
                    <input type="text" th:field="*{codeBamis}"
                           class="form-control" placeholder="Code commerçant">
                </div>

                <div class="code-item">
                    <label>🏦 BimBank</label>
                    <input type="text" th:field="*{codeBimbank}"
                           class="form-control" placeholder="Code commerçant">
                </div>

                <div class="code-item">
                    <label>🏦 BciPay</label>
                    <input type="text" th:field="*{codeBciPay}"
                           class="form-control" placeholder="Code commerçant">
                </div>

            </div>

            <button type="submit" class="btn-soumettre">
                Envoyer la demande
            </button>

        </form>

        <div class="lien-connexion">
            Déjà un compte ?
            <a href="/login" style="color:#185FA5;">Se connecter</a>
        </div>

    </div>
</div>
</body>
</html>
