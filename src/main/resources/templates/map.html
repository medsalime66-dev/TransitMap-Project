<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Carte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'Segoe UI',sans-serif;}
        .layout{display:flex;flex-direction:column;height:100vh;}
        .top-nav{background:#0f1729;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:1000;}
        .brand{color:white;font-size:17px;font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px;}
        .nav-right{display:flex;align-items:center;gap:6px;}
        .nav-link-item{color:#a0aec0;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;}
        .nav-link-item:hover{background:rgba(255,255,255,0.08);color:white;}
        .btn-login{background:#185FA5;color:white;padding:8px 20px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;}
        .btn-logout{background:#E24B4A;color:white;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;margin-left:6px;}
        .btn-dashboard{background:#1D9E75;color:white;padding:8px 18px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;}
        #map{flex:1;z-index:1;}
        .bottom-panel{background:white;border-top:1px solid #e0e0e0;padding:14px 24px;flex-shrink:0;max-height:160px;overflow-y:auto;}
        .panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
        .panel-title{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.8px;}
        .login-prompt{font-size:12px;color:#185FA5;text-decoration:none;font-weight:500;}
        .ligne-list{display:flex;flex-wrap:wrap;gap:8px;}
        .ligne-chip{background:#E6F1FB;color:#0C447C;border:1px solid #B5D4F4;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
        .ligne-chip:hover{background:#185FA5;color:white !important;}
        .chip-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
        .empty-msg{font-size:13px;color:#aaa;}
    </style>
</head>
<body>
<div class="layout">

    <nav class="top-nav">
        <a href="/map" class="brand">🚌 TransitMap</a>
        <div class="nav-right">
            <th:block th:if="${userRole == 'GUEST'}">
                <span style="color:#8896b3;font-size:13px;margin-right:8px;">Explorez les lignes interurbaines</span>
                <a href="/login" class="btn-login">Se connecter</a>
            </th:block>
            <th:block th:if="${userRole == 'VOYAGEUR'}">
                <a href="/map" class="nav-link-item">🗺 Carte</a>
                <a href="/voyageur/reservations" class="nav-link-item">🎫 Mes réservations</a>
                <a href="/logout" class="btn-logout">Déconnexion</a>
            </th:block>
            <th:block th:if="${userRole == 'AGENT'}">
                <a href="/agent/dashboard" class="btn-dashboard">📋 Tableau de bord</a>
                <a href="/logout" class="btn-logout">Déconnexion</a>
            </th:block>
            <th:block th:if="${userRole == 'ADMIN'}">
                <a href="/admin/dashboard" class="btn-dashboard">📊 Dashboard</a>
                <a href="/logout" class="btn-logout">Déconnexion</a>
            </th:block>
        </div>
    </nav>

    <div id="map"></div>

    <div class="bottom-panel">
        <div class="panel-header">
            <div class="panel-title">Lignes interurbaines disponibles</div>
            <th:block th:if="${userRole == 'GUEST'}">
                <a href="/login" class="login-prompt">Connectez-vous pour réserver →</a>
            </th:block>
        </div>
        <div class="ligne-list" id="ligneList">
            <span class="empty-msg">Chargement des lignes…</span>
        </div>
    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:inline="javascript">
    const isVoyageur = /*[[${userRole == 'VOYAGEUR'}]]*/ false;

    const map = L.map('map').setView([18.0735, -15.9582], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);

    const couleurs = ['#185FA5','#1D9E75','#BA7517','#7F77DD','#E24B4A','#0C447C'];
    const allBounds = [];

    fetch('/map-api/lignes')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('ligneList');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<span class="empty-msg">Aucune ligne disponible pour le moment.</span>';
                return;
            }

            data.forEach((ligne, index) => {
                const couleur = couleurs[index % couleurs.length];
                const etapes = (ligne.etapes || []).slice().sort((a,b) => a.ordre - b.ordre);

                // Chip cliquable
                const chip = document.createElement('a');
                chip.className = 'ligne-chip';
                chip.innerHTML = `<span class="chip-dot" style="background:${couleur}"></span>${ligne.nom}`;
                chip.href = isVoyageur
                    ? `/voyageur/interurbain/${ligne.id}/reserver`
                    : '/login';
                chip.style.borderColor = couleur;
                chip.style.color = couleur;
                container.appendChild(chip);

                if (etapes.length < 1) return;

                const coords = etapes.map(e => [e.latitude, e.longitude]);

                // Polyline de la ligne
                if (coords.length > 1) {
                    L.polyline(coords, {color: couleur, weight: 5, opacity: 0.85})
                        .addTo(map)
                        .bindPopup(`<b>${ligne.nom}</b><br><small>${ligne.villeDepart} → ${ligne.villeArrivee}</small>`);
                }

                // Marqueurs des arrêts
                etapes.forEach((e, i) => {
                    const terminal = i === 0 || i === etapes.length - 1;
                    L.circleMarker([e.latitude, e.longitude], {
                        radius: terminal ? 9 : 6,
                        color: couleur,
                        fillColor: terminal ? couleur : 'white',
                        fillOpacity: 1,
                        weight: 2
                    }).addTo(map)
                      .bindPopup(`<b>${e.nomVille}</b><br><small>${ligne.nom}</small>`);
                    allBounds.push([e.latitude, e.longitude]);
                });
            });

            // Ajuster la vue pour montrer toutes les lignes
            if (allBounds.length > 0) {
                map.fitBounds(L.latLngBounds(allBounds), {padding: [50, 50]});
            }
        })
        .catch(err => {
            console.error('Erreur chargement lignes:', err);
            document.getElementById('ligneList').innerHTML =
                '<span class="empty-msg">Erreur de chargement des lignes.</span>';
        });
</script>
</body>
</html>
