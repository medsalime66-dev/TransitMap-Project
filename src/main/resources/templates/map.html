<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Carte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; }
        .layout { display: flex; flex-direction: column; height: 100vh; }
        #map { flex: 1; z-index: 1; }
        .bottom-panel {
            height: 220px;
            background: white;
            border-top: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 12px 16px;
        }
        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .ligne-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .ligne-chip {
            background: #E6F1FB;
            color: #185FA5;
            border: 1px solid #B5D4F4;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .ligne-chip:hover { background: #185FA5; color: white; }
    </style>
</head>
<body>
<div class="layout">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Bottom Panel — قائمة الخطوط -->
    <div class="bottom-panel">
        <div class="panel-title">Lignes disponibles</div>
        <div class="ligne-list" id="ligneList">
            <!-- تُملأ من JS -->
        </div>
    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([18.0735, -15.9582], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // المحطات
    fetch('/api/arrets')
        .then(r => r.json())
        .then(data => {
            data.forEach(a => {
                L.marker([a.latitude, a.longitude])
                    .addTo(map)
                    .bindPopup(`<b>${a.nom}</b>`);
            });
        });

    // المركبات
    fetch('/api/vehicules')
        .then(r => r.json())
        .then(data => {
            data.forEach(v => {
                if (v.currentLatitude && v.currentLongitude) {
                    L.circleMarker([v.currentLatitude, v.currentLongitude], {
                        radius: 8,
                        color: '#EF9F27',
                        fillColor: '#EF9F27',
                        fillOpacity: 0.9
                    }).addTo(map).bindPopup(`<b>${v.matricule}</b>`);
                }
            });
        });

    // قائمة الخطوط في الـ panel
    fetch('/api/lignes')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('ligneList');
            data.forEach(l => {
                const chip = document.createElement('a');
                chip.href = `/voyageur/lignes/${l.id}/trajets`;
                chip.className = 'ligne-chip';
                chip.textContent = `${l.numero} — ${l.nom}`;
                container.appendChild(chip);
            });
        });
</script>
</body>
</html>
