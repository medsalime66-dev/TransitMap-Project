<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Edit Trajet</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
<form th:action="@{/trajets/edit/{id}(id=${trajet.id})}" th:object="${trajet}" method="post">
<input type="date" th:field="*{dateTrajet}" class="form-control mb-2">
<input type="time" th:field="*{heureDepart}" class="form-control mb-2">
<input type="time" th:field="*{heureArrivee}" class="form-control mb-2">
<input th:field="*{statut}" class="form-control mb-2">
<select th:field="*{ligneId}" class="form-select mb-3">
<option th:each="l:${lignes}" th:value="${l.id}" th:text="${l.nom}"></option>
</select>
<button class="btn btn-primary">Update</button>
</form>
</div>
</body>
</html>
