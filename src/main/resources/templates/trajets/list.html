<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Trajets</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
<a th:href="@{/trajets/create}" class="btn btn-success mb-3">Ajouter</a>
<table class="table table-bordered">
<thead><tr><th>ID</th><th>Date</th><th>Départ</th><th>Arrivée</th><th>Statut</th><th>Actions</th></tr></thead>
<tbody>
<tr th:each="t:${trajets}">
<td th:text="${t.id}"></td>
<td th:text="${t.dateTrajet}"></td>
<td th:text="${t.heureDepart}"></td>
<td th:text="${t.heureArrivee}"></td>
<td th:text="${t.statut}"></td>
<td>
<a th:href="@{/trajets/edit/{id}(id=${t.id})}" class="btn btn-warning btn-sm">Edit</a>
<a th:href="@{/trajets/delete/{id}(id=${t.id})}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
</tbody>
</table>
</div>
</body>
</html>
