<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un véhicule</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
    <h5 class="mb-3">Ajouter un véhicule</h5>
    <form th:action="@{/vehicules/create}"
          th:object="${vehicule}" method="post">

        <div class="mb-2">
            <label>Matricule *</label>
            <input th:field="*{matricule}" class="form-control">
            <div class="text-danger" th:errors="*{matricule}"></div>
        </div>

        <div class="mb-2">
            <label>Marque / Modèle</label>
            <input th:field="*{marque}" class="form-control"
                   placeholder="Toyota Coaster">
        </div>

        <div class="mb-2">
            <label>Capacité *</label>
            <input type="number" th:field="*{capacite}"
                   class="form-control" min="1">
            <div class="text-danger" th:errors="*{capacite}"></div>
        </div>

        <div class="mb-2">
            <label>Année</label>
            <input type="number" th:field="*{annee}"
                   class="form-control" placeholder="2020">
        </div>

        <div class="mb-2">
            <label>Statut *</label>
            <select th:field="*{statut}" class="form-select">
                <option value="EN_SERVICE">En service</option>
                <option value="EN_MAINTENANCE">En maintenance</option>
                <option value="HORS_SERVICE">Hors service</option>
            </select>
            <div class="text-danger" th:errors="*{statut}"></div>
        </div>

        <div class="mb-2">
            <label>Latitude actuelle</label>
            <input type="number" step="0.000001"
                   th:field="*{latitudeActuelle}"
                   class="form-control">
        </div>

        <div class="mb-2">
            <label>Longitude actuelle</label>
            <input type="number" step="0.000001"
                   th:field="*{longitudeActuelle}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Ligne *</label>
            <select th:field="*{ligneId}" class="form-select">
                <option value="">-- Choisir une ligne --</option>
                <option th:each="l : ${lignes}"
                        th:value="${l.id}"
                        th:text="${l.numero + ' — ' + l.nom}">
                </option>
            </select>
            <div class="text-danger" th:errors="*{ligneId}"></div>
        </div>

        <button class="btn btn-success">Enregistrer</button>
        <a th:href="@{/vehicules}"
           class="btn btn-secondary ms-2">Annuler</a>
    </form>
</div>
</body>
</html>
