<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Vehicules</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-4">
<a th:href="@{/vehicules/create}" class="btn btn-success mb-3">Ajouter</a>
<table class="table table-bordered">
<thead><tr><th>ID</th><th>Matricule</th><th>Capacite</th><th>Statut</th><th>Actions</th></tr></thead>
<tbody>
<tr th:each="v:${vehicules}">
<td th:text="${v.id}"></td>
<td th:text="${v.matricule}"></td>
<td th:text="${v.capacite}"></td>
<td th:text="${v.statut}"></td>
<td>
<a th:href="@{/vehicules/edit/{id}(id=${v.id})}" class="btn btn-warning btn-sm">Edit</a>
<a th:href="@{/vehicules/delete/{id}(id=${v.id})}" class="btn btn-danger btn-sm">Delete</a>
</td>
</tr>
</tbody>
</table>
</div>
</body>
</html>
