<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Inscription Voyageur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;display:flex;align-items:center;
             justify-content:center;min-height:100vh;padding:24px 0;}
        .card-wrap{width:440px;border-radius:12px;
                   border:1px solid #e0e0e0;padding:36px;
                   background:white;}
        .page-title{font-size:20px;font-weight:700;
                    color:#1a1a2e;margin-bottom:4px;}
        .page-sub{font-size:13px;color:#888;margin-bottom:24px;}
        .form-label{font-size:13px;color:#555;
                    margin-bottom:4px;display:block;}
        .form-control{font-size:13px;border-radius:8px;
                      border:1px solid #e0e0e0;padding:9px 12px;}
        .form-control:focus{border-color:#185FA5;
                            box-shadow:0 0 0 3px rgba(24,95,165,0.1);}
        .btn-submit{width:100%;background:#185FA5;color:white;
                    border:none;padding:11px;border-radius:8px;
                    font-size:15px;font-weight:600;cursor:pointer;
                    margin-top:8px;}
        .btn-submit:hover{background:#0C447C;}
        .back-link{display:block;text-align:center;
                   margin-top:16px;font-size:13px;
                   color:#185FA5;text-decoration:none;}
        .success-note{background:#EAF3DE;color:#3B6D11;
                      border:1px solid #97C459;border-radius:8px;
                      padding:10px 14px;font-size:12px;
                      margin-bottom:20px;}
        .text-danger{font-size:12px;color:#E24B4A;}
    </style>
</head>
<body>
<div class="card-wrap">
    <div class="page-title">Nouveau compte voyageur</div>
    <div class="page-sub">
        Inscription gratuite — accès immédiat après validation
    </div>

    <div class="success-note">
        ✓ Votre compte sera activé immédiatement après inscription
    </div>

    <!-- Erreurs globales -->
    <div th:if="${erreur}"
         style="background:#FCEBEB;color:#A32D2D;
                border:1px solid #F09595;border-radius:8px;
                padding:10px 14px;font-size:13px;
                margin-bottom:16px;"
         th:text="${erreur}">
    </div>

    <form th:action="@{/inscription/voyageur}"
          th:object="${voyageur}" method="post">

        <div class="mb-3">
            <label class="form-label">Nom complet *</label>
            <input type="text" th:field="*{nomComplet}"
                   class="form-control"
                   placeholder="Mohamed Ould...">
            <div class="text-danger"
                 th:errors="*{nomComplet}"></div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-6">
                <label class="form-label">Email *</label>
                <input type="email" th:field="*{email}"
                       class="form-control"
                       placeholder="email@example.com">
                <div class="text-danger"
                     th:errors="*{email}"></div>
            </div>
            <div class="col-6">
                <label class="form-label">Téléphone *</label>
                <input type="tel" th:field="*{telephone}"
                       class="form-control"
                       placeholder="20000000">
                <div class="text-danger"
                     th:errors="*{telephone}"></div>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-6">
                <label class="form-label">Mot de passe *</label>
                <input type="password" th:field="*{motDePasse}"
                       class="form-control"
                       placeholder="Min. 6 caractères">
                <div class="text-danger"
                     th:errors="*{motDePasse}"></div>
            </div>
            <div class="col-6">
                <label class="form-label">Confirmer *</label>
                <input type="password"
                       th:field="*{confirmerMotDePasse}"
                       class="form-control"
                       placeholder="••••••••">
                <div class="text-danger"
                     th:errors="*{confirmerMotDePasse}"></div>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            Créer mon compte →
        </button>
    </form>

    <a href="/inscription/choix" class="back-link">
        ← Retour au choix du compte
    </a>
</div>
</body>
</html>
