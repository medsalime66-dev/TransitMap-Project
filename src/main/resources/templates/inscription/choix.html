<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TransitMap — Créer un compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#f0f2f5;display:flex;align-items:center;
             justify-content:center;min-height:100vh;}
        .card-wrap{width:420px;border-radius:12px;
                   border:1px solid #e0e0e0;padding:36px;
                   background:white;}
        .page-title{font-size:20px;font-weight:700;
                    color:#1a1a2e;margin-bottom:4px;}
        .page-sub{font-size:13px;color:#888;margin-bottom:24px;}
        .choice-card{display:flex;align-items:center;gap:16px;
                     padding:18px;border:1px solid #e5e7eb;
                     border-radius:10px;margin-bottom:12px;
                     text-decoration:none;color:inherit;
                     transition:border-color 0.15s,
                                background 0.15s;}
        .choice-card:hover{border-color:#185FA5;
                           background:#E6F1FB;}
        .choice-card:hover .choice-arrow{color:#185FA5;}
        .choice-icon{width:48px;height:48px;border-radius:10px;
                     display:flex;align-items:center;
                     justify-content:center;font-size:24px;
                     flex-shrink:0;}
        .choice-title{font-size:15px;font-weight:600;
                      color:#1a1a2e;margin-bottom:3px;}
        .choice-sub{font-size:12px;color:#888;}
        .choice-badge{font-size:11px;padding:2px 10px;
                      border-radius:20px;margin-top:5px;
                      display:inline-block;}
        .choice-arrow{font-size:18px;color:#ccc;
                      margin-left:auto;flex-shrink:0;}
        .back-link{display:block;text-align:center;
                   margin-top:20px;font-size:13px;
                   color:#185FA5;text-decoration:none;}
        .back-link:hover{color:#0C447C;}
    </style>
</head>
<body>
<div class="card-wrap">
    <div class="page-title">Créer un compte</div>
    <div class="page-sub">
        Choisissez votre type de compte pour continuer
    </div>

    <!-- Voyageur -->
    <a href="/inscription/voyageur" class="choice-card">
        <div class="choice-icon"
             style="background:#E6F1FB;">🧭</div>
        <div style="flex:1;">
            <div class="choice-title">Voyageur</div>
            <div class="choice-sub">
                Réservez des trajets et achetez des tickets
            </div>
            <span class="choice-badge"
                  style="background:#EAF3DE;color:#3B6D11;">
                ✓ Accès immédiat
            </span>
        </div>
        <div class="choice-arrow">→</div>
    </a>

    <!-- Agent -->
    <a href="/inscription/agent" class="choice-card">
        <div class="choice-icon"
             style="background:#EAF3DE;">🏢</div>
        <div style="flex:1;">
            <div class="choice-title">Agent de transport</div>
            <div class="choice-sub">
                Gérez lignes, chauffeurs et véhicules
            </div>
            <span class="choice-badge"
                  style="background:#FAEEDA;color:#633806;">
                ⏳ Soumis à validation admin
            </span>
        </div>
        <div class="choice-arrow">→</div>
    </a>

    <a href="/login" class="back-link">
        ← Retour à la connexion
    </a>
</div>
</body>
</html>
